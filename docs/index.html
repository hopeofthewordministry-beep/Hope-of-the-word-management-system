<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Hope of the Word Ministry</title>

<style>

*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,Helvetica,sans-serif;
}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#123b5d,#1d607d);
  padding:20px;
}

.login-container{
  width:100%;
  max-width:420px;
}

.login-box{
  background:white;
  border-radius:16px;
  padding:35px;
  box-shadow:0 15px 40px rgba(0,0,0,.2);
}

.logo{
  width:75px;
  height:75px;
  margin:0 auto 18px;
  background:#123b5d;
  color:white;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:30px;
}

h1{
  text-align:center;
  color:#123b5d;
  font-size:22px;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  font-size:13px;
  margin-top:7px;
  margin-bottom:28px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  color:#374151;
  margin-bottom:7px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:8px;
  margin-bottom:18px;
  font-size:15px;
  outline:none;
}

input:focus{
  border-color:#123b5d;
}

.login-button{
  width:100%;
  padding:13px;
  background:#123b5d;
  color:white;
  border:none;
  border-radius:8px;
  font-size:15px;
  font-weight:bold;
  cursor:pointer;
}

.login-button:hover{
  background:#0d2d46;
}

.error{
  display:none;
  background:#fee2e2;
  color:#b91c1c;
  padding:10px;
  border-radius:7px;
  font-size:13px;
  margin-bottom:15px;
  text-align:center;
}

.footer{
  text-align:center;
  color:#9ca3af;
  font-size:12px;
  margin-top:20px;
}

</style>
</head>

<body>

<div class="login-container">

<div class="login-box">

<div class="logo">
⛪
</div>

<h1>Hope of the Word Ministry</h1>

<p class="subtitle">
Church Management System
</p>

<div id="error" class="error">
Incorrect username or password.
</div>

<form onsubmit="login(event)">

<label>
Username
</label>

<input
type="text"
id="username"
placeholder="Enter username"
required
>

<label>
Password
</label>

<input
type="password"
id="password"
placeholder="Enter password"
required
>

<button class="login-button" type="submit">
Login
</button>

</form>

</div>

<div class="footer">
© 2026 Hope of the Word Ministry
</div>

</div>


<script>

function login(event){

event.preventDefault();

const username =
document.getElementById("username").value;

const password =
document.getElementById("password").value;

/*
DEMO LOGIN

Username: admin
Password: admin123

This is only for testing.
We will replace it with secure
authentication later.
*/

if(username === "admin" && password === "admin123"){

window.location.href =
"dashboard.html";

}else{

document.getElementById("error").style.display =
"block";

}

}

</script>

</body>
</html>
