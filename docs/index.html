<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sign In | Hope of the Word Ministry</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  min-height: 100vh;
  font-family: Arial, sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 20px;

  background: linear-gradient(
    135deg,
    #F4C430,
    #FFFFFF,
    #90EE90
  );
}

.card {
  width: 100%;
  max-width: 430px;

  background: #FFFFFF;

  padding: 30px 25px;

  border-radius: 20px;

  box-shadow: 0 15px 40px rgba(0, 0, 0, 0.20);
}

.logo {
  width: 78px;
  height: 78px;

  margin: 0 auto 15px;

  border-radius: 50%;

  background: #F4C430;

  display: flex;
  justify-content: center;
  align-items: center;

  color: #14532D;

  font-size: 34px;
  font-weight: bold;

  border: 5px solid #90EE90;
}

h1 {
  text-align: center;

  color: #14532D;

  font-size: 22px;

  margin: 5px 0;
}

.subtitle {
  text-align: center;

  color: #6b7280;

  font-size: 14px;

  margin-bottom: 25px;
}

label {
  display: block;

  font-size: 14px;

  font-weight: bold;

  margin-bottom: 6px;

  color: #374151;
}

input {
  width: 100%;

  padding: 13px;

  border: 1px solid #d1d5db;

  border-radius: 8px;

  margin-bottom: 16px;

  font-size: 15px;
}

input:focus {
  outline: none;

  border-color: #90EE90;

  box-shadow: 0 0 0 2px rgba(144, 238, 144, 0.25);
}

button {
  width: 100%;

  padding: 14px;

  border: none;

  border-radius: 8px;

  background: #90EE90;

  color: #14532D;

  font-size: 16px;

  font-weight: bold;

  cursor: pointer;
}

button:hover {
  background: #7edc7e;
}

button:disabled {
  opacity: 0.6;

  cursor: not-allowed;
}

.signup {
  display: block;

  text-align: center;

  margin-top: 18px;

  padding: 13px;

  border: 2px solid #F4C430;

  border-radius: 8px;

  color: #14532D;

  text-decoration: none;

  font-weight: bold;
}

.signup:hover {
  background: #fffbea;
}

.message {
  display: none;

  padding: 12px;

  margin-bottom: 15px;

  border-radius: 7px;

  text-align: center;

  font-size: 14px;
}

.error {
  background: #fee2e2;
  color: #991b1b;
}

.pending {
  background: #fff8cc;
  color: #795600;
}

.success {
  background: #dcfce7;
  color: #166534;
}
</style>
</head>

<body>

<div class="card">

  <div class="logo">
    ★
  </div>

  <h1>
    Hope of the Word Ministry
  </h1>

  <div class="subtitle">
    Church Management System
  </div>

  <div
    id="message"
    class="message"
  ></div>

  <form id="loginForm">

    <label>
      Email Address
    </label>

    <input
      type="email"
      id="email"
      placeholder="Enter your email"
      autocomplete="email"
      required
    >

    <label>
      Password
    </label>

    <input
      type="password"
      id="password"
      placeholder="Enter your password"
      autocomplete="current-password"
      required
    >

    <button
      type="submit"
      id="loginButton"
    >
      Sign In
    </button>

  </form>

  <a
    href="signup.html"
    class="signup"
  >
    Create New Account
  </a>

</div>

<script>

/* =================================
   SUPABASE
   ================================= */

const SUPABASE_URL =
"https://lcrhoossfgxpktrvwdtj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KPNyDlm7lteOz0f1bivVAw_CbTAGbtH";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =================================
   LOGIN
   ================================= */

document
.getElementById("loginForm")
.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      document
      .getElementById("email")
      .value
      .trim()
      .toLowerCase();

    const password =
      document
      .getElementById("password")
      .value;

    const button =
      document
      .getElementById("loginButton");

    hideMessage();

    button.disabled = true;

    button.textContent =
      "Signing in...";

    try {

      const {
        data,
        error
      } =
      await supabaseClient
      .auth
      .signInWithPassword({
        email: email,
        password: password
      });

      if (error) {

        console.error(
          "Login error:",
          error
        );

        showMessage(
          "Invalid email or password.",
          "error"
        );

        button.disabled = false;

        button.textContent =
          "Sign In";

        return;
      }

      const user =
        data.user;

      if (!user) {

        showMessage(
          "Unable to find your account.",
          "error"
        );

        button.disabled = false;

        button.textContent =
          "Sign In";

        return;
      }


      /* Find profile using Auth UID */

      const {
        data: profile,
        error: profileError
      } =
      await supabaseClient
      .from("user_profiles")
      .select("*")
      .eq(
        "auth_user_id",
        user.id
      )
      .maybeSingle();


      if (profileError) {

        console.error(
          "Profile error:",
          profileError
        );

        await supabaseClient
        .auth
        .signOut();

        showMessage(
          "Unable to load your church profile.",
          "error"
        );

        button.disabled = false;

        button.textContent =
          "Sign In";

        return;
      }


      if (!profile) {

        await supabaseClient
        .auth
        .signOut();

        showMessage(
          "Your church profile was not found. Please contact the administrator.",
          "error"
        );

        button.disabled = false;

        button.textContent =
          "Sign In";

        return;
      }


      const status =
        String(
          profile.status || ""
        )
        .trim()
        .toLowerCase();


      const role =
        String(
          profile.role || ""
        )
        .trim()
        .toLowerCase();


      if (status === "pending") {

        await supabaseClient
        .auth
        .signOut();

        showMessage(
          "Your account is pending Administrator approval.",
          "pending"
        );

        button.disabled = false;

        button.textContent =
          "Sign In";

        return;
      }


      if (status === "rejected") {

        await supabaseClient
        .auth
        .signOut();

        showMessage(
          "Your account has been rejected. Please contact the Administrator.",
          "error"
        );

        button.disabled = false;

        button.textContent =
          "Sign In";

        return;
      }


      if (status !== "approved") {

        await supabaseClient
        .auth
        .signOut();

        showMessage(
          "Your account has not been approved yet.",
          "pending"
        );

        button.disabled = false;

        button.textContent =
          "Sign In";

        return;
      }


      localStorage.setItem(
        "user_profile",
        JSON.stringify(profile)
      );


      if (role === "administrator") {

        window.location.href =
          "dashboard.html";

        return;
      }


      window.location.href =
        "dashboard.html";

    }

    catch (error) {

      console.error(
        "Unexpected login error:",
        error
      );

      showMessage(
        "Something went wrong. Please try again.",
        "error"
      );

      button.disabled = false;

      button.textContent =
        "Sign In";
    }

  }
);


/* =================================
   MESSAGES
   ================================= */

function showMessage(
  text,
  type
) {

  const message =
    document
    .getElementById("message");

  message.textContent =
    text;

  message.className =
    "message " + type;

  message.style.display =
    "block";
}


function hideMessage() {

  document
  .getElementById("message")
  .style.display =
    "none";
}

</script>

</body>
</html>
