<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hope of the Word Ministry - Login</title>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      background: linear-gradient(
        135deg,
        #071a33,
        #17365d,
        #245a91
      );
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 35px 30px;
      border-top: 6px solid #d4af37;
      box-shadow: 0 15px 45px rgba(0, 0, 0, 0.25);
    }

    /* CHURCH ICON */

    .church-icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 50%;
      background: #17365d;
      border: 4px solid #d4af37;

      font-size: 48px;
      color: #d4af37;

      box-shadow: 0 5px 20px rgba(0,0,0,.18);
    }

    .church-name {
      text-align: center;
      color: #17365d;
      font-size: 21px;
      font-weight: bold;
      line-height: 1.4;
    }

    .branch {
      text-align: center;
      color: #9a7a12;
      font-size: 13px;
      font-weight: bold;
      margin-top: 6px;
      margin-bottom: 28px;
    }

    .system-title {
      text-align: center;
      color: #17365d;
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 22px;
    }

    /* MESSAGE */

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 16px;
      border-radius: 7px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #842029;
      border-left: 4px solid #b42318;
    }

    .message.success {
      background: #d1e7dd;
      color: #0f5132;
      border-left: 4px solid #198754;
    }

    .message.info {
      background: #e8f1fa;
      color: #17365d;
      border-left: 4px solid #17365d;
    }

    /* FORM */

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #263238;
      font-size: 14px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;

      border: 1px solid #d0d5dd;
      border-radius: 8px;

      background: #fafafa;

      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #d4af37;
      background: white;

      box-shadow:
        0 0 0 3px rgba(212,175,55,.15);
    }

    /* PASSWORD */

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;

      transform: translateY(-50%);

      border: none;
      background: transparent;

      color: #17365d;
      font-size: 12px;
      font-weight: bold;

      cursor: pointer;
    }

    .show-password:hover {
      color: #d4af37;
    }

    /* LOGIN BUTTON */

    .login-btn {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 8px;

      background: #17365d;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .login-btn:hover {
      background: #0b1f3a;
    }

    .login-btn:disabled {
      background: #7b8794;
      cursor: not-allowed;
    }

    /* SIGN UP */

    .signup {
      text-align: center;
      margin-top: 20px;
    }

    .signup a {
      color: #17365d;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    .signup a:hover {
      color: #b08d16;
      text-decoration: underline;
    }

    /* CONNECTION */

    .connection {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
    }

    .connected {
      color: #198754;
      font-weight: bold;
    }

    .disconnected {
      color: #b42318;
      font-weight: bold;
    }

    /* FOOTER */

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #98a2b3;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 500px) {

      body {
        padding: 12px;
      }

      .card {
        padding: 30px 20px;
      }

      .church-icon {
        width: 80px;
        height: 80px;
        font-size: 42px;
      }

      .church-name {
        font-size: 18px;
      }

      .system-title {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <!-- CHURCH BUILDING ICON -->

    <div class="church-icon">
      ⛪
    </div>


    <!-- CHURCH NAME -->

    <div class="church-name">
      HOPE OF THE WORD MINISTRY
    </div>

    <div class="branch">
      BUOHO FRAMOASE BRANCH
    </div>


    <!-- SYSTEM NAME -->

    <div class="system-title">
      Church Management System
    </div>


    <!-- MESSAGE -->

    <div id="message" class="message"></div>


    <!-- LOGIN FORM -->

    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

          <button
            type="button"
            class="show-password"
            id="showPassword">

            Show

          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn">

        Login

      </button>

    </form>


    <!-- CREATE ACCOUNT -->

    <div class="signup">

      <a href="signup.html">
        Create an Account
      </a>

    </div>


    <!-- CONNECTION STATUS -->

    <div
      id="connectionStatus"
      class="connection">

      Checking Supabase connection...

    </div>


    <!-- FOOTER -->

    <div class="footer">

      Hope of the Word Ministry<br>

      Church Management System

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE CONFIGURATION
   ========================================================= */

/*
   IMPORTANT:

   KEEP YOUR ORIGINAL SUPABASE VALUES.

   Replace ONLY the two lines below with the values
   from your existing working index.html.

   DO NOT use the service_role or secret key.
*/

const SUPABASE_URL =
  "PASTE YOUR EXISTING SUPABASE PROJECT URL HERE";

const SUPABASE_KEY =
  "PASTE YOUR EXISTING SUPABASE PUBLIC KEY HERE";


/* =========================================================
   SUPABASE CLIENT
   ========================================================= */

let supabaseClient = null;


/* =========================================================
   START
   ========================================================= */

window.addEventListener("load", function () {

  initializeSupabase();

});


/* =========================================================
   INITIALIZE SUPABASE
   ========================================================= */

function initializeSupabase() {

  const status =
    document.getElementById("connectionStatus");


  if (!window.supabase) {

    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase library not loaded' +
      '</span>';

    showMessage(
      "Supabase library could not load. Check your internet connection.",
      "error"
    );

    return;
  }


  if (
    !SUPABASE_URL ||
    SUPABASE_URL.includes(
      "PASTE YOUR EXISTING"
    )
  ) {

    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase URL missing' +
      '</span>';

    showMessage(
      "Supabase URL is missing. Enter your existing Project URL.",
      "error"
    );

    return;
  }


  if (
    !SUPABASE_KEY ||
    SUPABASE_KEY.includes(
      "PASTE YOUR EXISTING"
    )
  ) {

    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase key missing' +
      '</span>';

    showMessage(
      "Supabase key is missing. Enter your existing public key.",
      "error"
    );

    return;
  }


  try {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    status.innerHTML =
      '<span class="connected">' +
      '● Supabase connected' +
      '</span>';

    console.log(
      "Supabase initialized successfully."
    );

  }

  catch (error) {

    console.error(
      "Supabase initialization error:",
      error
    );

    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase connection error' +
      '</span>';

    showMessage(
      "Supabase connection error: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   LOGIN
   ========================================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function (event) {

      event.preventDefault();


      if (!supabaseClient) {

        showMessage(
          "Supabase is not connected. Please check your URL and key.",
          "error"
        );

        return;
      }


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const loginButton =
        document.getElementById("loginBtn");


      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;
      }


      if (!password) {

        showMessage(
          "Please enter your password.",
          "error"
        );

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "Signing in...";


      showMessage(
        "Signing in...",
        "info"
      );


      try {

        const {
          data,
          error
        } =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (error) {

          console.error(
            "Login error:",
            error
          );


          showMessage(
            getLoginError(error),
            "error"
          );


          loginButton.disabled = false;

          loginButton.textContent =
            "Login";

          return;
        }


        if (!data || !data.user) {

          showMessage(
            "Login failed. No user account was returned.",
            "error"
          );


          loginButton.disabled = false;

          loginButton.textContent =
            "Login";

          return;
        }


        showMessage(
          "Login successful. Opening dashboard...",
          "success"
        );


        loginButton.textContent =
          "Opening...";


        setTimeout(function () {

          window.location.href =
            "dashboard.html";

        }, 700);

      }

      catch (error) {

        console.error(
          "Unexpected login error:",
          error
        );


        showMessage(
          "Login error: " +
          error.message,
          "error"
        );


        loginButton.disabled = false;

        loginButton.textContent =
          "Login";

      }

    }
  );


/* =========================================================
   SHOW / HIDE PASSWORD
   ========================================================= */

document
  .getElementById("showPassword")
  .addEventListener(
    "click",
    function () {

      const password =
        document.getElementById("password");


      if (password.type === "password") {

        password.type = "text";

        this.textContent = "Hide";

      }

      else {

        password.type = "password";

        this.textContent = "Show";

      }

    }
  );


/* =========================================================
   LOGIN ERROR
   ========================================================= */

function getLoginError(error) {

  const message =
    String(
      error.message || ""
    ).toLowerCase();


  if (
    message.includes(
      "invalid login credentials"
    )
  ) {

    return "Incorrect email or password.";

  }


  if (
    message.includes(
      "email not confirmed"
    )
  ) {

    return "Your email has not been confirmed in Supabase.";

  }


  if (
    message.includes(
      "failed to fetch"
    )
  ) {

    return "Cannot connect to Supabase. Please check your Project URL and internet connection.";

  }


  if (
    message.includes(
      "invalid api key"
    )
  ) {

    return "The Supabase public key is incorrect.";

  }


  return (
    "Login failed: " +
    error.message
  );

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById("message");


  message.textContent =
    text;


  message.className =
    "message show " + type;

}

</script>

</body>
</html>
