<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"

<title>
Hope of the Word Ministry

<style>

*{

body{

);

}

.login-box{

max-width:430px;

background:white;

padding:35px;

box-shadow:
0 15px 40px
rgba(0,0,0,.25);

}

background:white;

}

button{

width:100%;

padding:14px;

background:#123b5d;

color:white;

border:none;

}

button:hover{

background:#0d2d46;

}

#error{

display:none;

background:#fee2e2;

color:#b91c1c;

padding:12px;

border-radius:8px;

text-align:center;

margin-bottom:18px;

font-size:13px;

}

.footer{

text-align:center;

color:#888;

font-size:12px;

margin-top:25px;

}

</style>

</head>


<body>


<div class="login-box">


<div class="logo">
⛪
</div>


<h1>
Hope of the Word Ministry
</h1>


<p class="subtitle">
Church Management System
</p>


<div id="error">
Incorrect login details.
</div>


<form onsubmit="login(event)">


<label>
Login as
</label>


<select id="role" required>

<option value="">
Select your role
</option>

<option value="pastor">
Pastor
</option>

<option value="secretary">
Secretary
</option>

<option value="treasurer">
Treasurer
</option>

<option value="admin">
Administrator
</option>

</select>


<label>
Username
</label>


<input
type="text"
id="email"
placeholder="Enter email"
required
>


<label>
Password
</label>


<input
type="password"
id="password"
placeholder="Enter password"
required
>


<button type="submit">
Login
</button>
<div style="text-align:center; margin-top:15px;">
  <a href="signup.html">Create an Account</a>
</div>

</form>


<div class="footer">
© 2026 Hope of the Word Ministry
</div>


</div>


<script>

async function login(event) {

  event.preventDefault();

  const email =
    document.getElementById("email").value.trim();

  const password =
    document.getElementById("password").value;

  if (!email || !password) {
    alert("Please enter your email and password.");
    return;
  }

  try {

    // Sign in with Supabase
    const { data, error } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (error) {
      alert(error.message);
      return;
    }

    // Find the user's role
    const { data: profile, error: profileError } =
      await supabaseClient
        .from("user_profiles")
        .select("full_name, email, role")
        .eq("email", email)
        .single();

    if (profileError || !profile) {
      alert(
        "Your account is created, but your church profile has not been assigned yet."
      );

      await supabaseClient.auth.signOut();
      return;
    }

    const role = profile.role;

    // Save login information
    localStorage.setItem(
      "user_profile",
      JSON.stringify(profile)
    );

    // Send user to the appropriate dashboard
    if (role === "administrator") {

      window.location.href =
        "dashboard.html";

    } else if (role === "pastor") {

      window.location.href =
        "dashboard.html";

    } else if (role === "secretary") {

      window.location.href =
        "dashboard.html";

    } else if (role === "treasurer") {

      window.location.href =
        "dashboard.html";

    } else {

      alert("Your account has an invalid role.");

      await supabaseClient.auth.signOut();
    }

  } catch (error) {

    alert(
      "Something went wrong: " +
      error.message
    );

  }

}

event.preventDefault();

const role =
document.getElementById("role").value;

const email =
document.getElementById("email").value.trim();

const password =
document.getElementById("password").value;


/* CHURCH ACCOUNTS */

const accounts = {

pastor:{

password:"pastor123"
},

username:"secretary",
password:"secretary123"
},

treasurer:{
username:"treasurer",
password:"treasurer123"
},

admin:{
username:"admin",
password:"admin123"
}

};


/* CHECK LOGIN */

if(

accounts[role] &&

accounts[role].username === username &&

accounts[role].password === password

){

localStorage.setItem(
"churchRole",
role
);

localStorage.setItem(
"churchUser",

);

window.location.href =
"dashboard.html";

}

else{

document.getElementById(
"error"
).style.display =
"block";

}

}

</script>


</body>

</html>
