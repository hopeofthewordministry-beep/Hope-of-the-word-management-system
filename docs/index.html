<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Hope of the Word Ministry</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-box {
      width: 92%;
      max-width: 420px;
      background: white;
      padding: 30px;
      border-radius: 12px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.12);
    }

    .logo {
      text-align: center;
      margin-bottom: 20px;
    }

    .logo h1 {
      margin: 0;
      font-size: 24px;
    }

    .logo p {
      margin-top: 8px;
      color: #666;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 6px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 13px;
      margin-top: 22px;
      border: none;
      border-radius: 6px;
      background: #123b5d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
    }

    .signup a {
      color: #123b5d;
      font-weight: bold;
      text-decoration: none;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }

  </style>

</head>


<body>

  <div class="login-box">

    <div class="logo">

      <h1>Hope of the Word Ministry</h1>

      <p>Management System</p>

    </div>


    <form id="loginForm">

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >


      <button
        type="submit"
        id="loginButton"
      >
        Login
      </button>

    </form>


    <div id="message"></div>


    <div class="signup">

      Don't have an account?

      <a href="signup.html">
        Create an Account
      </a>

    </div>

  </div>


<script>


/* =========================================
   SUPABASE CONNECTION
   ========================================= */

const SUPABASE_URL =
  "https://lcrhoossfgxpktrvwdtj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_KPNyDlm7lteOz0f1bivVAw_CbTAGbtH";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   LOGIN
   ========================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      const button =
        document
          .getElementById("loginButton");


      const message =
        document
          .getElementById("message");


      if (!email || !password) {

        message.textContent =
          "Please enter your email and password.";

        return;
      }


      button.disabled = true;

      button.textContent =
        "Logging in...";


      message.textContent = "";


      try {


        /* SIGN IN */

        const {
          data: authData,
          error: authError
        } =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        if (authError) {

          message.textContent =
            authError.message;

          button.disabled = false;

          button.textContent =
            "Login";

          return;
        }


        if (!authData.user) {

          message.textContent =
            "Login failed.";

          button.disabled = false;

          button.textContent =
            "Login";

          return;
        }


        /* GET PROFILE */

        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from("user_profiles")
            .select(
              "id, full_name, email, role, status, auth_user_id, phone"
            )
            .eq(
              "auth_user_id",
              authData.user.id
            )
            .single();


        if (profileError) {

          console.error(
            "Profile error:",
            profileError
          );

          message.textContent =
            "Login successful, but your profile could not be found.";

          await supabaseClient.auth.signOut();

          button.disabled = false;

          button.textContent =
            "Login";

          return;
        }


        /* CHECK APPROVAL */

        if (
          profile.status !==
          "approved"
        ) {

          message.textContent =
            "Your account is still pending Administrator approval.";

          await supabaseClient.auth.signOut();

          button.disabled = false;

          button.textContent =
            "Login";

          return;
        }


        /* SAVE PROFILE */

        localStorage.setItem(
          "user_profile",
          JSON.stringify(profile)
        );


        /* OPEN DASHBOARD */

        window.location.href =
          "dashboard.html";

      }

      catch (error) {

        console.error(
          "Login error:",
          error
        );

        message.textContent =
          "Something went wrong: " +
          error.message;

        button.disabled = false;

        button.textContent =
          "Login";
      }

    }
  );


</script>

</body>

</html>
