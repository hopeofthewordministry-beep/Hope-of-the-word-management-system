<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | Hope of the Word Ministry</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
  background:linear-gradient(
    to bottom,
    #ce1126 0%,#ce1126 33.33%,
    #fcd116 33.33%,#fcd116 66.66%,
    #006b3c 66.66%,#006b3c 100%
  );
}

.card{
  width:100%;
  max-width:430px;
  background:white;
  padding:30px 25px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.28);
}

.logo{
  width:80px;
  height:80px;
  margin:0 auto 15px;
  border-radius:50%;
  background:linear-gradient(
    to bottom,
    #ce1126 0%,#ce1126 33%,
    #fcd116 33%,#fcd116 66%,
    #006b3c 66%,#006b3c 100%
  );
  display:flex;
  align-items:center;
  justify-content:center;
  color:white;
  font-size:35px;
  font-weight:bold;
  border:4px solid white;
}

h1{
  text-align:center;
  color:#123b5d;
  font-size:23px;
  margin:5px 0;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  font-size:14px;
  margin-bottom:25px;
}

label{
  display:block;
  font-size:14px;
  font-weight:bold;
  margin-bottom:6px;
}

input{
  width:100%;
  padding:13px;
  border:1px solid #d1d5db;
  border-radius:8px;
  margin-bottom:16px;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#006b3c;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.signup{
  display:block;
  text-align:center;
  margin-top:18px;
  padding:13px;
  border:1px solid #ce1126;
  border-radius:8px;
  color:#ce1126;
  text-decoration:none;
  font-weight:bold;
}

.message{
  display:none;
  padding:12px;
  margin-bottom:15px;
  border-radius:7px;
  text-align:center;
  font-size:14px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

@media(max-width:480px){
  .card{padding:25px 20px}
}
</style>
</head>

<body>

<div class="card">

<div class="logo">★</div>

<h1>Hope of the Word Ministry</h1>

<div class="subtitle">Church Management System</div>

<div id="message" class="message"></div>

<form id="loginForm">

<label>Email Address</label>

<input
  type="email"
  id="email"
  placeholder="Enter your email"
  required
>

<label>Password</label>

<input
  type="password"
  id="password"
  placeholder="Enter your password"
  required
>

<button id="loginButton" type="submit">
Sign In
</button>

</form>

<a class="signup" href="signup.html">
Create New Account
</a>

</div>

<script>

/* ==============================
   SUPABASE
   ============================== */

const SUPABASE_URL =
"YOUR_EXISTING_SUPABASE_URL";

const SUPABASE_KEY =
"YOUR_EXISTING_SUPABASE_KEY";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==============================
   LOGIN
   ============================== */

document
.getElementById("loginForm")
.addEventListener("submit", async function(e){

  e.preventDefault();

  const email =
    document.getElementById("email")
    .value.trim().toLowerCase();

  const password =
    document.getElementById("password")
    .value;

  const button =
    document.getElementById("loginButton");

  hideMessage();

  button.disabled=true;
  button.textContent="Signing in...";

  try{

    const {
      data,
      error
    } =
    await supabaseClient.auth
    .signInWithPassword({
      email:email,
      password:password
    });

    if(error){

      showMessage(
        "Invalid email or password.",
        "error"
      );

      button.disabled=false;
      button.textContent="Sign In";

      return;
    }

    const user=data.user;

    if(!user){

      showMessage(
        "Unable to sign in.",
        "error"
      );

      button.disabled=false;
      button.textContent="Sign In";

      return;
    }


    /* FIND PROFILE USING AUTH UID */

    const {
      data:profile,
      error:profileError
    } =
    await supabaseClient
    .from("user_profiles")
    .select("*")
    .eq("auth_user_id",user.id)
    .maybeSingle();


    if(profileError || !profile){

      await supabaseClient.auth.signOut();

      showMessage(
        "Your church profile was not found. Please contact the administrator.",
        "error"
      );

      button.disabled=false;
      button.textContent="Sign In";

      return;
    }


    const status =
      String(profile.status || "")
      .trim()
      .toLowerCase();

    const role =
      String(profile.role || "")
      .trim()
      .toLowerCase();


    if(status==="pending"){

      await supabaseClient.auth.signOut();

      showMessage(
        "Your account is pending Administrator approval.",
        "pending"
      );

      button.disabled=false;
      button.textContent="Sign In";

      return;
    }


    if(status==="rejected"){

      await supabaseClient.auth.signOut();

      showMessage(
        "Your account was rejected. Please contact the Administrator.",
        "error"
      );

      button.disabled=false;
      button.textContent="Sign In";

      return;
    }


    if(status!=="approved"){

      await supabaseClient.auth.signOut();

      showMessage(
        "Your account has not been approved yet.",
        "pending"
      );

      button.disabled=false;
      button.textContent="Sign In";

      return;
    }


    localStorage.setItem(
      "user_profile",
      JSON.stringify(profile)
    );


    if(role==="administrator"){

      window.location.href="dashboard.html";

    }else{

      /*
       Temporary:
       approved normal users also
       enter the dashboard.
       A separate member dashboard
       can be created later.
      */

      window.location.href="dashboard.html";

    }

});

}


/* ==============================
   MESSAGES
   ============================== */

function showMessage(text,type){

  const box=
    document.getElementById("message");

  box.textContent=text;

  box.className=
    "message "+type;

  box.style.display="block";
}

function hideMessage(){

  document.getElementById("message")
  .style.display="none";

}

</script>

</body>
</html>
