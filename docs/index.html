<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hope of the Word Ministry - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      background:
        linear-gradient(
          rgba(0, 80, 40, 0.75),
          rgba(0, 0, 0, 0.65)
        ),
        linear-gradient(
          135deg,
          #ce1126 0%,
          #fcd116 50%,
          #006b3f 100%
        );
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: white;
      border-radius: 15px;
      padding: 30px;
      box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
    }

    .logo-area {
      text-align: center;
      margin-bottom: 25px;
    }

    .church-logo {
      width: 75px;
      height: 75px;
      margin: 0 auto 15px;

      display: flex;
      justify-content: center;
      align-items: center;

      border-radius: 50%;
      background: #17365d;
      color: white;

      font-size: 28px;
      font-weight: bold;
    }

    .church-name {
      color: #17365d;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.4;
    }

    .branch {
      color: #666;
      font-size: 14px;
      margin-top: 5px;
    }

    h2 {
      text-align: center;
      color: #17365d;
      margin-bottom: 20px;
    }

    .form-group {
      margin-bottom: 16px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 7px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #17365d;
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 75px;
    }

    .show-password {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);

      border: none;
      background: transparent;
      color: #17365d;

      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }

    .login-btn {
      width: 100%;
      padding: 13px;

      border: none;
      border-radius: 7px;

      background: #17365d;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
      margin-top: 5px;
    }

    .login-btn:hover {
      background: #245a91;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.4;
    }

    .message.error {
      display: block;
      background: #f8d7da;
      color: #842029;
    }

    .message.success {
      display: block;
      background: #d1e7dd;
      color: #0f5132;
    }

    .message.info {
      display: block;
      background: #cff4fc;
      color: #055160;
    }

    .links {
      text-align: center;
      margin-top: 20px;
    }

    .links a {
      color: #17365d;
      text-decoration: none;
      font-weight: bold;
      font-size: 14px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 12px;
    }

    @media (max-width: 500px) {

      body {
        padding: 12px;
      }

      .login-card {
        padding: 23px 18px;
      }

      .church-name {
        font-size: 18px;
      }

    }
  </style>
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <!-- CHURCH HEADER -->

    <div class="logo-area">

      <div class="church-logo">
        HW
      </div>

      <div class="church-name">
        HOPE OF THE WORD MINISTRY
      </div>

      <div class="branch">
        BUOHO FRAMOASE BRANCH
      </div>

    </div>


    <h2>Church Management System</h2>


    <!-- MESSAGE -->

    <div id="message" class="message"></div>


    <!-- LOGIN FORM -->

    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

          <button
            type="button"
            class="show-password"
            onclick="togglePassword()"
            id="showPasswordBtn">

            Show

          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn">

        Login

      </button>

    </form>


    <div class="links">

      <a href="signup.html">
        Create an Account
      </a>

    </div>


    <div class="footer">

      Hope of the Word Ministry<br>
      Church Management System

    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE CONNECTION
   ========================================================= */

const SUPABASE_URL =
"YOUR_SUPABASE_URL";

const SUPABASE_ANON_KEY =
"YOUR_SUPABASE_ANON_KEY";


const supabaseClient =
window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_ANON_KEY
);


/* =========================================================
   LOGIN FORM
   ========================================================= */

document
.getElementById("loginForm")
.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();

    const email =
      document
      .getElementById("email")
      .value
      .trim();

    const password =
      document
      .getElementById("password")
      .value;


    if (!email || !password) {

      showMessage(
        "Please enter your email and password.",
        "error"
      );

      return;
    }


    const loginButton =
      document.getElementById("loginBtn");

    loginButton.disabled = true;
    loginButton.textContent =
      "Signing in...";


    showMessage(
      "Signing in. Please wait...",
      "info"
    );


    try {

      /* =========================================
         SUPABASE AUTH LOGIN
         ========================================= */

      const {
        data,
        error
      } =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });


      if (error) {

        console.error(
          "Login error:",
          error
        );

        showMessage(
          getLoginError(error),
          "error"
        );

        loginButton.disabled = false;
        loginButton.textContent =
          "Login";

        return;
      }


      if (!data || !data.user) {

        showMessage(
          "Login failed. No user account was returned.",
          "error"
        );

        loginButton.disabled = false;
        loginButton.textContent =
          "Login";

        return;
      }


      const user =
        data.user;


      /* =========================================
         CHECK USER PROFILE
         ========================================= */

      let profile = null;


      try {

        const profileResult =
          await supabaseClient
          .from("user_profiles")
          .select("*")
          .eq(
            "auth_user_id",
            user.id
          )
          .maybeSingle();


        if (!profileResult.error) {

          profile =
            profileResult.data;

        } else {

          console.warn(
            "Profile could not be loaded:",
            profileResult.error
          );

        }

      } catch(profileError) {

        console.warn(
          "Profile check failed:",
          profileError
        );

      }


      /* =========================================
         CHECK ACCOUNT STATUS
         ========================================= */

      if (profile) {

        const status =
          String(
            profile.status || ""
          ).toLowerCase();


        if (status === "pending") {

          await supabaseClient.auth.signOut();

          showMessage(
            "Your account is waiting for administrator approval.",
            "error"
          );

          loginButton.disabled = false;
          loginButton.textContent =
            "Login";

          return;
        }


        if (status === "rejected") {

          await supabaseClient.auth.signOut();

          showMessage(
            "Your account has been rejected by the administrator.",
            "error"
          );

          loginButton.disabled = false;
          loginButton.textContent =
            "Login";

          return;
        }

      }


      /* =========================================
         LOGIN SUCCESS
         ========================================= */

      showMessage(
        "Login successful. Opening dashboard...",
        "success"
      );


      setTimeout(
        function() {

          window.location.href =
            "dashboard.html";

        },
        500
      );


    } catch(error) {

      console.error(
        "Unexpected login error:",
        error
      );

      showMessage(
        "Unable to load. Please check your Supabase connection.",
        "error"
      );

      loginButton.disabled = false;
      loginButton.textContent =
        "Login";

    }

  }
);


/* =========================================================
   SHOW / HIDE PASSWORD
   ========================================================= */

function togglePassword() {

  const password =
    document.getElementById(
      "password"
    );

  const button =
    document.getElementById(
      "showPasswordBtn"
    );


  if(password.type === "password") {

    password.type = "text";

    button.textContent =
      "Hide";

  } else {

    password.type = "password";

    button.textContent =
      "Show";

  }

}


/* =========================================================
   ERROR MESSAGES
   ========================================================= */

function getLoginError(error) {

  const message =
    String(
      error.message || ""
    ).toLowerCase();


  if(
    message.includes(
      "invalid login credentials"
    )
  ) {

    return "Incorrect email or password.";

  }


  if(
    message.includes(
      "email not confirmed"
    )
  ) {

    return "Your email has not been confirmed. Please confirm your email first.";

  }


  if(
    message.includes(
      "user not found"
    )
  ) {

    return "No account was found with this email.";

  }


  if(
    message.includes(
      "failed to fetch"
    )
  ) {

    return "Unable to connect to Supabase. Check your Supabase URL and internet connection.";

  }


  if(
    message.includes(
      "network"
    )
  ) {

    return "Network connection problem. Please check your internet connection.";

  }


  return (
    "Login failed: " +
    error.message
  );

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );

  message.textContent =
    text;

  message.className =
    "message " + type;

}

</script>

</body>
</html>
