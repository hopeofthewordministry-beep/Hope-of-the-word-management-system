   <!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hope of the Word Ministry - Login</title>

  <!-- Supabase JavaScript Library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 15px;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.5),
          rgba(0, 0, 0, 0.5)
        ),
        linear-gradient(
          135deg,
          #ce1126 0%,
          #fcd116 50%,
          #006b3f 100%
        );
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #ffffff;
      border-radius: 18px;
      padding: 30px 25px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.3);
    }

    /* Church icon */
    .church-icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 15px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #17365d;
      color: white;

      font-size: 48px;

      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
    }

    .church-name {
      text-align: center;
      color: #17365d;
      font-size: 20px;
      font-weight: bold;
      line-height: 1.4;
    }

    .branch {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-top: 5px;
      margin-bottom: 25px;
    }

    h2 {
      text-align: center;
      color: #17365d;
      font-size: 20px;
      margin-bottom: 20px;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .error {
      background: #f8d7da;
      color: #842029;
    }

    .success {
      background: #d1e7dd;
      color: #0f5132;
    }

    .info {
      background: #cff4fc;
      color: #055160;
    }

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: bold;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 7px;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #17365d;
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 70px;
    }

    .show-btn {
      position: absolute;
      right: 8px;
      top: 50%;
      transform: translateY(-50%);

      border: none;
      background: transparent;
      color: #17365d;

      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
    }

    .login-btn {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 7px;

      background: #17365d;
      color: white;

      font-size: 16px;
      font-weight: bold;

      cursor: pointer;
    }

    .login-btn:hover {
      background: #245a91;
    }

    .login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
    }

    .signup a {
      color: #17365d;
      font-size: 14px;
      font-weight: bold;
      text-decoration: none;
    }

    .signup a:hover {
      text-decoration: underline;
    }

    .connection {
      text-align: center;
      margin-top: 17px;
      font-size: 12px;
    }

    .connected {
      color: #198754;
      font-weight: bold;
    }

    .disconnected {
      color: #dc3545;
      font-weight: bold;
    }

    .footer {
      text-align: center;
      margin-top: 20px;
      color: #777;
      font-size: 12px;
      line-height: 1.5;
    }

    @media (max-width: 500px) {
      .card {
        padding: 25px 18px;
      }

      .church-icon {
        width: 80px;
        height: 80px;
        font-size: 42px;
      }

      .church-name {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <!-- CHURCH BUILDING ICON -->
    <div class="church-icon">
      ⛪
    </div>

    <div class="church-name">
      HOPE OF THE WORD MINISTRY
    </div>

    <div class="branch">
      BUOHO FRAMOASE BRANCH
    </div>

    <h2>
      Church Management System
    </h2>

    <!-- MESSAGE -->
    <div id="message" class="message"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

          <button
            type="button"
            class="show-btn"
            id="showPassword">

            Show

          </button>

        </div>

      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginBtn">

        Login

      </button>

    </form>

    <!-- SIGN UP -->
    <div class="signup">

      <a href="signup.html">
        Create an Account
      </a>

    </div>

    <!-- CONNECTION STATUS -->
    <div
      id="connectionStatus"
      class="connection">

      Checking Supabase connection...

    </div>

    <div class="footer">
      Hope of the Word Ministry<br>
      Church Management System
    </div>

  </div>

</div>


<script>

/* =========================================================
   SUPABASE SETTINGS
   ========================================================= */

/*
   IMPORTANT:
   Replace the two values below with your actual values.

   Get them from:
   Supabase
   → Project
   → Settings
   → API
*/

const SUPABASE_URL =
  "https://lcrhoossfgxpktrvwdtj.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_KPNyDlm7lteOz0f1bivVAw_CbTAGbtH";


/* =========================================================
   GLOBAL SUPABASE CLIENT
   ========================================================= */

let supabaseClient = null;


/* =========================================================
   START APPLICATION
   ========================================================= */

window.addEventListener("load", function() {

  initializeSupabase();

});


/* =========================================================
   INITIALIZE SUPABASE
   ========================================================= */

function initializeSupabase() {

  const status =
    document.getElementById(
      "connectionStatus"
    );


  /* Check Supabase library */

  if (!window.supabase) {

    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase library did not load' +
      '</span>';

    showMessage(
      "Supabase library could not load. Check your internet connection.",
      "error"
    );

    return;
  }


  /* Check URL */

  if (
    !SUPABASE_URL ||
    SUPABASE_URL ===
      "YOUR_SUPABASE_URL"
  ) {

    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase URL is missing' +
      '</span>';

    showMessage(
      "Please enter your Supabase Project URL in index.html.",
      "error"
    );

    return;
  }


  /* Check key */

  if (
    !SUPABASE_ANON_KEY ||
    SUPABASE_ANON_KEY ===
      "YOUR_SUPABASE_ANON_KEY"
  ) {

    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase key is missing' +
      '</span>';

    showMessage(
      "Please enter your Supabase public/publishable key in index.html.",
      "error"
    );

    return;
  }


  /* Create Supabase client */

  try {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    status.innerHTML =
      '<span class="connected">' +
      '● Supabase connection ready' +
      '</span>';


    console.log(
      "Supabase client created successfully."
    );


  } catch(error) {

    console.error(
      "Supabase initialization error:",
      error
    );


    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase configuration error' +
      '</span>';


    showMessage(
      "Supabase configuration error: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   LOGIN
   ========================================================= */

document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      /* Make sure Supabase is ready */

      if (!supabaseClient) {

        showMessage(
          "Supabase is not connected. Check the Project URL and public key in this file.",
          "error"
        );

        return;
      }


      const email =
        document
          .getElementById("email")
          .value
          .trim();


      const password =
        document
          .getElementById("password")
          .value;


      if (!email) {

        showMessage(
          "Please enter your email address.",
          "error"
        );

        return;
      }


      if (!password) {

        showMessage(
          "Please enter your password.",
          "error"
        );

        return;
      }


      const button =
        document.getElementById(
          "loginBtn"
        );


      button.disabled = true;

      button.textContent =
        "Signing in...";


      showMessage(
        "Signing in...",
        "info"
      );


      try {

        console.log(
          "Attempting Supabase login..."
        );


        const result =
          await supabaseClient.auth
            .signInWithPassword({

              email: email,

              password: password

            });


        const data =
          result.data;

        const error =
          result.error;


        console.log(
          "Login response:",
          result
        );


        /* Login error */

        if (error) {

          console.error(
            "Supabase login error:",
            error
          );


          showMessage(
            getLoginErrorMessage(error),
            "error"
          );


          button.disabled =
            false;

          button.textContent =
            "Login";

          return;
        }


        /* No user */

        if (
          !data ||
          !data.user
        ) {

          showMessage(
            "Login failed because Supabase did not return a user.",
            "error"
          );


          button.disabled =
            false;

          button.textContent =
            "Login";

          return;
        }


        /* ==========================================
           SUCCESS
           ========================================== */

        console.log(
          "User logged in:",
          data.user.id
        );


        showMessage(
          "Login successful. Opening dashboard...",
          "success"
        );


        button.textContent =
          "Opening...";


        setTimeout(
          function() {

            window.location.href =
              "dashboard.html";

          },
          700
        );

      }


      catch(error) {

        console.error(
          "Unexpected login error:",
          error
        );


        showMessage(
          "Login error: " +
          error.message,
          "error"
        );


        button.disabled =
          false;

        button.textContent =
          "Login";

      }

    }
  );


/* =========================================================
   SHOW / HIDE PASSWORD
   ========================================================= */

document
  .getElementById("showPassword")
  .addEventListener(
    "click",
    function() {

      const password =
        document.getElementById(
          "password"
        );


      if (
        password.type ===
        "password"
      ) {

        password.type =
          "text";

        this.textContent =
          "Hide";

      } else {

        password.type =
          "password";

        this.textContent =
          "Show";

      }

    }
  );


/* =========================================================
   LOGIN ERROR MESSAGE
   ========================================================= */

function getLoginErrorMessage(error) {

  const message =
    String(
      error.message || ""
    ).toLowerCase();


  if (
    message.includes(
      "invalid login credentials"
    )
  ) {

    return (
      "Incorrect email or password."
    );

  }


  if (
    message.includes(
      "email not confirmed"
    )
  ) {

    return (
      "Your email has not been confirmed in Supabase."
    );

  }


  if (
    message.includes(
      "failed to fetch"
    )
  ) {

    return (
      "Cannot connect to Supabase. Check your internet connection and Project URL."
    );

  }


  if (
    message.includes(
      "network"
    )
  ) {

    return (
      "Network error. Please check your internet connection."
    );

  }


  if (
    message.includes(
      "invalid api key"
    )
  ) {

    return (
      "The Supabase public/publishable key is incorrect."
    );

  }


  return (
    "Login failed: " +
    error.message
  );

}


/* =========================================================
   SHOW MESSAGE
   ========================================================= */

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message show " +
    type;

}

</script>

</body>
</html>
