<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hope of the Word Ministry - Login</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;

      background:
        linear-gradient(
          135deg,
          #0b1f3a 0%,
          #17365d 55%,
          #1f4e79 100%
        );
    }

    .container {
      width: 100%;
      max-width: 430px;
    }

    .card {
      background: #fff;
      border-radius: 18px;
      padding: 35px 30px;
      border-top: 5px solid #c9a227;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .church-icon {
      width: 90px;
      height: 90px;
      margin: 0 auto 18px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 50%;
      background: #17365d;
      color: #d4af37;

      font-size: 48px;
      border: 4px solid #d4af37;

      box-shadow: 0 5px 18px rgba(0,0,0,.18);
    }

    .church-name {
      text-align: center;
      color: #17365d;
      font-size: 21px;
      font-weight: 700;
      line-height: 1.4;
    }

    .branch {
      text-align: center;
      color: #8a6d1d;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: .5px;
      margin-top: 6px;
      margin-bottom: 28px;
    }

    .system-title {
      text-align: center;
      color: #17365d;
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .message {
      display: none;
      padding: 12px;
      border-radius: 8px;
      margin-bottom: 15px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #f8d7da;
      color: #842029;
      border-left: 4px solid #b42318;
    }

    .message.success {
      background: #d1e7dd;
      color: #0f5132;
      border-left: 4px solid #198754;
    }

    .message.info {
      background: #e8f1fa;
      color: #17365d;
      border-left: 4px solid #17365d;
    }

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-size: 14px;
      font-weight: 600;
      color: #263238;
    }

    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d5d9df;
      border-radius: 8px;
      background: #fafbfc;
      font-size: 15px;
    }

    input:focus {
      outline: none;
      border-color: #c9a227;
      background: #fff;
      box-shadow: 0 0 0 3px rgba(201,162,39,.12);
    }

    .password-wrapper {
      position: relative;
    }

    .password-wrapper input {
      padding-right: 70px;
    }

    .show-btn {
      position: absolute;
      right: 9px;
      top: 50%;
      transform: translateY(-50%);

      border: none;
      background: transparent;
      color: #17365d;
      font-size: 12px;
      font-weight: bold;
      cursor: pointer;
    }

    .show-btn:hover {
      color: #c9a227;
    }

    .login-btn {
      width: 100%;
      padding: 14px;

      border: none;
      border-radius: 8px;

      background: #17365d;
      color: #fff;

      font-size: 16px;
      font-weight: 700;

      cursor: pointer;
      transition: .2s;
    }

    .login-btn:hover {
      background: #0b1f3a;
    }

    .login-btn:disabled {
      background: #7b8794;
      cursor: not-allowed;
    }

    .signup {
      text-align: center;
      margin-top: 20px;
    }

    .signup a {
      color: #17365d;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    .signup a:hover {
      color: #c9a227;
      text-decoration: underline;
    }

    .connection {
      text-align: center;
      margin-top: 18px;
      font-size: 12px;
      color: #667085;
    }

    .connected {
      color: #198754;
      font-weight: 600;
    }

    .disconnected {
      color: #b42318;
      font-weight: 600;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      color: #98a2b3;
      font-size: 12px;
      line-height: 1.6;
    }

    @media (max-width: 500px) {
      body {
        padding: 12px;
      }

      .card {
        padding: 30px 20px;
      }

      .church-icon {
        width: 82px;
        height: 82px;
        font-size: 43px;
      }

      .church-name {
        font-size: 18px;
      }

      .system-title {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

<div class="container">

  <div class="card">

    <!-- CHURCH BUILDING ICON -->
    <div class="church-icon">
      ⛪
    </div>

    <div class="church-name">
      HOPE OF THE WORD MINISTRY
    </div>

    <div class="branch">
      BUOHO FRAMOASE BRANCH
    </div>

    <div class="system-title">
      Church Management System
    </div>

    <div id="message" class="message"></div>

    <!-- LOGIN FORM -->
    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>

      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="password-wrapper">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

          <button
            type="button"
            class="show-btn"
            id="showPassword">
            Show
          </button>

        </div>

      </div>

      <button
        type="submit"
        class="login-btn"
        id="loginBtn">
        Login
      </button>

    </form>

    <div class="signup">
      <a href="signup.html">
        Create an Account
      </a>
    </div>

    <div id="connectionStatus" class="connection">
      Checking Supabase connection...
    </div>

    <div class="footer">
      Hope of the Word Ministry<br>
      Church Management System
    </div>

  </div>

</div>


<script>

/* =========================================================
   YOUR ORIGINAL SUPABASE NAMES
   ========================================================= */

/*
   KEEP YOUR EXISTING VALUES HERE.

   Example:

   const SUPABASE_URL = "https://xxxxxxxx.supabase.co";
   const SUPABASE_KEY = "your-existing-public-key";

   Do NOT replace your actual values with the example.
*/

const SUPABASE_URL = "YOUR_EXISTING_SUPABASE_URL";

const SUPABASE_KEY = "YOUR_EXISTING_SUPABASE_KEY";


/* =========================================================
   CREATE SUPABASE CLIENT
   ========================================================= */

let supabaseClient = null;


/* =========================================================
   INITIALIZE
   ========================================================= */

window.addEventListener("load", function () {

  initializeSupabase();

});


function initializeSupabase() {

  const status =
    document.getElementById("connectionStatus");


  if (!window.supabase) {

    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase library not loaded' +
      '</span>';

    showMessage(
      "Supabase could not load. Check your internet connection.",
      "error"
    );

    return;
  }


  if (
    !SUPABASE_URL ||
    SUPABASE_URL ===
    "YOUR_EXISTING_SUPABASE_URL"
  ) {

    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase URL is missing' +
      '</span>';

    showMessage(
      "Your Supabase URL is missing.",
      "error"
    );

    return;
  }


  if (
    !SUPABASE_KEY ||
    SUPABASE_KEY ===
    "YOUR_EXISTING_SUPABASE_KEY"
  ) {

    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase key is missing' +
      '</span>';

    showMessage(
      "Your Supabase key is missing.",
      "error"
    );

    return;
  }


  try {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
      );


    status.innerHTML =
      '<span class="connected">' +
      '● Supabase connection ready' +
      '</span>';


    console.log(
      "Supabase connected successfully."
    );

  }

  catch (error) {

    console.error(
      "Supabase error:",
      error
    );

    status.innerHTML =
      '<span class="disconnected">' +
      '● Supabase connection error' +
      '</span>';

    showMessage(
      "Supabase connection error: " +
      error.message,
      "error"
    );

  }

}


/* =========================================================
   LOGIN
   ========================================================= */

document
  .getElementById("loginForm")
  .addEventListener("submit", async function (event) {

    event.preventDefault();


    if (!supabaseClient) {

      showMessage(
        "Supabase is not connected. Please check your URL and key.",
        "error"
      );

      return;
    }


    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    const loginButton =
      document.getElementById("loginBtn");


    if (!email) {

      showMessage(
        "Please enter your email address.",
        "error"
      );

      return;
    }


    if (!password) {

      showMessage(
        "Please enter your password.",
        "error"
      );

      return;
    }


    loginButton.disabled = true;

    loginButton.textContent =
      "Signing in...";


    showMessage(
      "Signing in...",
      "info"
    );


    try {

      const {
        data,
        error
      } =
        await supabaseClient.auth
          .signInWithPassword({

            email: email,

            password: password

          });


      if (error) {

        console.error(
          "Login error:",
          error
        );


        showMessage(
          getLoginError(error),
          "error"
        );


        loginButton.disabled = false;

        loginButton.textContent =
          "Login";

        return;
      }


      if (!data || !data.user) {

        showMessage(
          "Login failed. No user account was returned.",
          "error"
        );


        loginButton.disabled = false;

        loginButton.textContent =
          "Login";

        return;
      }


      showMessage(
        "Login successful. Opening dashboard...",
        "success"
      );


      loginButton.textContent =
        "Opening...";


      setTimeout(function () {

        window.location.href =
          "dashboard.html";

      }, 700);

    }

    catch (error) {

      console.error(
        "Unexpected login error:",
        error
      );


      showMessage(
        "Login error: " +
        error.message,
        "error"
      );


      loginButton.disabled = false;

      loginButton.textContent =
        "Login";

    }

  });


/* =========================================================
   SHOW / HIDE PASSWORD
   ========================================================= */

document
  .getElementById("showPassword")
  .addEventListener("click", function () {

    const password =
      document.getElementById("password");


    if (password.type === "password") {

      password.type = "text";

      this.textContent = "Hide";

    } else {

      password.type = "password";

      this.textContent = "Show";

    }

  });


/* =========================================================
   LOGIN ERROR
   ========================================================= */

function getLoginError(error) {

  const message =
    String(
      error.message || ""
    ).toLowerCase();


  if (
    message.includes(
      "invalid login credentials"
    )
  ) {

    return "Incorrect email or password.";

  }


  if (
    message.includes(
      "email not confirmed"
    )
  ) {

    return "Your email has not been confirmed in Supabase.";

  }


  if (
    message.includes(
      "failed to fetch"
    )
  ) {

    return "Cannot connect to Supabase. Check your internet connection and Project URL.";

  }


  if (
    message.includes(
      "invalid api key"
    )
  ) {

    return "The Supabase public key is incorrect.";

  }


  return (
    "Login failed: " +
    error.message
  );

}


/* =========================================================
   MESSAGE
   ========================================================= */

function showMessage(text, type) {

  const message =
    document.getElementById("message");


  message.textContent =
    text;


  message.className =
    "message show " + type;

}

</script>

</body>
</html>
