<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Hope of the Word Ministry - Login</title>

  <!-- SUPABASE -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;

      padding: 20px;

      background:
        linear-gradient(
          rgba(0, 0, 0, 0.45),
          rgba(0, 0, 0, 0.55)
        ),
        linear-gradient(
          135deg,
          #ce1126,
          #fcd116,
          #006b3f
        );
    }

    .login-container {
      width: 100%;
      max-width: 430px;
    }

    .login-card {
      background: white;
      border-radius: 18px;

      padding: 30px;

      box-shadow:
        0 12px 35px rgba(0,0,0,0.3);
    }

    /* ================= CHURCH ICON ================= */

    .church-icon {
      width: 90px;
      height: 90px;

      margin: 0 auto 15px;

      border-radius: 50%;

      background: #17365d;

      display: flex;
      justify-content: center;
      align-items: center;

      color: white;

      font-size: 50px;

      box-shadow:
        0 5px 15px rgba(0,0,0,0.2);
    }

    .church-name {
      text-align: center;

      color: #17365d;

      font-size: 20px;

      font-weight: bold;

      line-height: 1.4;
    }

    .branch {
      text-align: center;

      color: #666;

      font-size: 14px;

      margin-top: 5px;

      margin-bottom: 25px;
    }

    h2 {
      text-align: center;

      color: #17365d;

      margin-bottom: 20px;

      font-size: 20px;
    }

    /* ================= MESSAGE ================= */

    .message {
      display: none;

      padding: 12px;

      border-radius: 7px;

      margin-bottom: 15px;

      font-size: 14px;

      line-height: 1.5;
    }

    .message.error {
      display: block;

      background: #f8d7da;

      color: #842029;
    }

    .message.success {
      display: block;

      background: #d1e7dd;

      color: #0f5132;
    }

    .message.info {
      display: block;

      background: #cff4fc;

      color: #055160;
    }

    /* ================= FORM ================= */

    .form-group {
      margin-bottom: 17px;
    }

    label {
      display: block;

      font-weight: bold;

      font-size: 14px;

      margin-bottom: 7px;

      color: #333;
    }

    input {
      width: 100%;

      padding: 13px;

      border: 1px solid #ccc;

      border-radius: 7px;

      font-size: 15px;
    }

    input:focus {
      outline: none;

      border-color: #17365d;

      box-shadow:
        0 0 0 2px rgba(23,54,93,0.1);
    }

    .password-box {
      position: relative;
    }

    .password-box input {
      padding-right: 70px;
    }

    .show-password {
      position: absolute;

      right: 10px;

      top: 50%;

      transform: translateY(-50%);

      border: none;

      background: transparent;

      color: #17365d;

      font-size: 12px;

      font-weight: bold;

      cursor: pointer;
    }

    /* ================= LOGIN BUTTON ================= */

    .login-btn {
      width: 100%;

      padding: 14px;

      border: none;

      border-radius: 7px;

      background: #17365d;

      color: white;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    .login-btn:hover {
      background: #245a91;
    }

    .login-btn:disabled {
      opacity: 0.6;

      cursor: not-allowed;
    }

    /* ================= LINKS ================= */

    .links {
      text-align: center;

      margin-top: 20px;
    }

    .links a {
      color: #17365d;

      text-decoration: none;

      font-weight: bold;

      font-size: 14px;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .footer {
      text-align: center;

      margin-top: 20px;

      color: #777;

      font-size: 12px;

      line-height: 1.5;
    }

    /* ================= CONNECTION STATUS ================= */

    .connection {
      text-align: center;

      font-size: 12px;

      margin-top: 15px;

      color: #666;
    }

    .connected {
      color: #198754;

      font-weight: bold;
    }

    .not-connected {
      color: #dc3545;

      font-weight: bold;
    }

    @media(max-width:500px) {

      body {
        padding: 12px;
      }

      .login-card {
        padding: 24px 18px;
      }

      .church-icon {
        width: 80px;
        height: 80px;
        font-size: 42px;
      }

      .church-name {
        font-size: 18px;
      }

    }
  </style>
</head>

<body>

<div class="login-container">

  <div class="login-card">

    <!-- ================= CHURCH BUILDING ICON ================= -->

    <div class="church-icon">
      ⛪
    </div>

    <div class="church-name">
      HOPE OF THE WORD MINISTRY
    </div>

    <div class="branch">
      BUOHO FRAMOASE BRANCH
    </div>


    <h2>
      Church Management System
    </h2>


    <!-- ================= MESSAGE ================= -->

    <div
      id="message"
      class="message">
    </div>


    <!-- ================= LOGIN FORM ================= -->

    <form id="loginForm">

      <div class="form-group">

        <label for="email">
          Email Address
        </label>

        <input
          type="email"
          id="email"
          placeholder="Enter your email"
          autocomplete="email"
          required>

      </div>


      <div class="form-group">

        <label for="password">
          Password
        </label>

        <div class="password-box">

          <input
            type="password"
            id="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>

          <button
            type="button"
            class="show-password"
            id="showPasswordBtn">

            Show

          </button>

        </div>

      </div>


      <button
        type="submit"
        class="login-btn"
        id="loginBtn">

        Login

      </button>

    </form>


    <!-- ================= SIGN UP ================= -->

    <div class="links">

      <a href="signup.html">
        Create an Account
      </a>

    </div>


    <!-- ================= CONNECTION ================= -->

    <div
      id="connectionStatus"
      class="connection">

      Checking connection...

    </div>


    <div class="footer">

      Hope of the Word Ministry<br>

      Church Management System

    </div>

  </div>

</div>


<script>

/* ==========================================================
   SUPABASE CONFIGURATION
   ========================================================== */

const SUPABASE_URL =
"https://lcrhoossfgxpktrvwdtj.supabase.co";

const SUPABASE_ANON_KEY =
"sb_publishable_KPNyDlm7lteOz0f1bivVAw_CbTAGbtH";


/* ==========================================================
   CHECK SUPABASE LIBRARY
   ========================================================== */

if (!window.supabase) {

  showMessage(
    "Supabase could not load. Check your internet connection.",
    "error"
  );

  document.getElementById(
    "connectionStatus"
  ).innerHTML =
    '<span class="not-connected">● Supabase library not loaded</span>';

} else {

  initializeSupabase();

}


/* ==========================================================
   INITIALIZE SUPABASE
   ========================================================== */

let supabaseClient = null;


function initializeSupabase() {

  try {

    supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    document.getElementById(
      "connectionStatus"
    ).innerHTML =
      '<span class="connected">● Login system ready</span>';


  } catch(error) {

    console.error(error);

    document.getElementById(
      "connectionStatus"
    ).innerHTML =
      '<span class="not-connected">● Supabase configuration error</span>';

  }

}


/* ==========================================================
   LOGIN
   ========================================================== */

document
.getElementById("loginForm")
.addEventListener(
  "submit",
  async function(event) {

    event.preventDefault();


    if (!supabaseClient) {

      showMessage(
        "Supabase is not connected. Please check your Supabase URL and key.",
        "error"
      );

      return;
    }


    const email =
      document
      .getElementById("email")
      .value
      .trim();


    const password =
      document
      .getElementById("password")
      .value;


    if (!email || !password) {

      showMessage(
        "Please enter your email and password.",
        "error"
      );

      return;
    }


    const loginButton =
      document.getElementById(
        "loginBtn"
      );


    loginButton.disabled = true;

    loginButton.textContent =
      "Signing in...";


    showMessage(
      "Signing in...",
      "info"
    );


    try {

      const {
        data,
        error
      } =
      await supabaseClient.auth
      .signInWithPassword({

        email: email,

        password: password

      });


      if (error) {

        console.error(
          "SUPABASE LOGIN ERROR:",
          error
        );


        showMessage(
          getLoginError(error),
          "error"
        );


        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";

        return;
      }


      if (!data || !data.user) {

        showMessage(
          "Login failed. No user account was returned.",
          "error"
        );


        loginButton.disabled =
          false;

        loginButton.textContent =
          "Login";

        return;
      }


      /* ==============================================
         LOGIN SUCCESS
         ============================================== */

      showMessage(
        "Login successful. Opening dashboard...",
        "success"
      );


      /*
        We deliberately do NOT require
        church profile information here.
      */


      setTimeout(
        function() {

          window.location.href =
            "dashboard.html";

        },
        700
      );


    } catch(error) {

      console.error(
        "LOGIN ERROR:",
        error
      );


      showMessage(
        "Unable to connect to the login system: " +
        error.message,
        "error"
      );


      loginButton.disabled =
        false;

      loginButton.textContent =
        "Login";

    }

  }
);


/* ==========================================================
   SHOW PASSWORD
   ========================================================== */

document
.getElementById("showPasswordBtn")
.addEventListener(
  "click",
  function() {

    const password =
      document.getElementById(
        "password"
      );


    if (
      password.type ===
      "password"
    ) {

      password.type =
        "text";

      this.textContent =
        "Hide";

    } else {

      password.type =
        "password";

      this.textContent =
        "Show";

    }

  }
);


/* ==========================================================
   ERROR HANDLING
   ========================================================== */

function getLoginError(error) {

  const message =
    String(
      error.message || ""
    ).toLowerCase();


  if (
    message.includes(
      "invalid login credentials"
    )
  ) {

    return "Incorrect email or password.";

  }


  if (
    message.includes(
      "email not confirmed"
    )
  ) {

    return "Your email has not been confirmed in Supabase.";

  }


  if (
    message.includes(
      "failed to fetch"
    )
  ) {

    return "Cannot connect to Supabase. Check your Supabase URL and internet connection.";

  }


  if (
    message.includes(
      "network"
    )
  ) {

    return "Network connection problem. Check your internet connection.";

  }


  return (
    "Login failed: " +
    error.message
  );

}


/* ==========================================================
   MESSAGE
   ========================================================== */

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " + type;

}

</script>

</body>
  </html>
