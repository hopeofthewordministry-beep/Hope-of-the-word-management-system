<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1.0"
>

<title>Create Account | Hope of the Word Ministry</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>

*{box-sizing:border-box}

body{
  margin:0;
  min-height:100vh;
  font-family:Arial,sans-serif;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;

  background:linear-gradient(
    to bottom,
    #ce1126 0%,#ce1126 33.33%,
    #fcd116 33.33%,#fcd116 66.66%,
    #006b3c 66.66%,#006b3c 100%
  );
}

.card{
  width:100%;
  max-width:450px;
  background:white;
  padding:28px 24px;
  border-radius:20px;
  box-shadow:0 15px 40px rgba(0,0,0,.25);
}

.logo{
  width:75px;
  height:75px;
  margin:0 auto 12px;
  border-radius:50%;

  background:linear-gradient(
    to bottom,
    #ce1126 0%,#ce1126 33%,
    #fcd116 33%,#fcd116 66%,
    #006b3c 66%,#006b3c 100%
  );

  display:flex;
  align-items:center;
  justify-content:center;

  color:white;
  font-size:32px;
  font-weight:bold;
}

h1{
  text-align:center;
  color:#123b5d;
  font-size:23px;
  margin:5px 0;
}

.subtitle{
  text-align:center;
  color:#6b7280;
  font-size:14px;
  margin-bottom:22px;
}

label{
  display:block;
  margin-bottom:6px;
  font-size:14px;
  font-weight:bold;
}

input,select{
  width:100%;
  padding:13px;
  margin-bottom:15px;
  border:1px solid #d1d5db;
  border-radius:8px;
  font-size:15px;
  background:white;
}

button{
  width:100%;
  padding:14px;
  border:0;
  border-radius:8px;
  background:#006b3c;
  color:white;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
}

button:disabled{
  opacity:.6;
}

.signin{
  display:block;
  text-align:center;
  margin-top:18px;
  padding:12px;
  border:1px solid #ce1126;
  border-radius:8px;
  color:#ce1126;
  text-decoration:none;
  font-weight:bold;
}

.message{
  display:none;
  padding:12px;
  border-radius:7px;
  margin-bottom:15px;
  text-align:center;
  font-size:14px;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

.pending{
  background:#fef3c7;
  color:#92400e;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">★</div>

<h1>Hope of the Word Ministry</h1>

<div class="subtitle">
Create New Account
</div>

<div id="message" class="message"></div>

<form id="signupForm">

<label>Full Name</label>

<input
  type="text"
  id="fullName"
  placeholder="Enter your full name"
  required
>

<label>Email Address</label>

<input
  type="email"
  id="email"
  placeholder="Enter your email"
  required
>

<label>Phone Number</label>

<input
  type="tel"
  id="phone"
  placeholder="Enter your phone number"
  required
>

<label>Account Type</label>

<select id="role" required>

<option value="">
Select account type
</option>

<option value="member">
Church Member
</option>

<option value="leader">
Church Leader
</option>

</select>

<label>Password</label>

<input
  type="password"
  id="password"
  placeholder="Create a password"
  minlength="6"
  required
>

<label>Confirm Password</label>

<input
  type="password"
  id="confirmPassword"
  placeholder="Confirm your password"
  minlength="6"
  required
>

<button
  type="submit"
  id="signupButton"
>
Create Account
</button>

</form>

<a
  href="index.html"
  class="signin"
>
Already have an account? Sign In
</a>

</div>


<script>

/* ==============================
   SUPABASE
   ============================== */

const SUPABASE_URL =
"https://lcrhoossfgxpktrvwdtj.supabase.co";

const SUPABASE_KEY =
"sb_publishable_KPNyDlm7lteOz0f1bivVAw_CbTAGbtH";

const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* ==============================
   SIGN UP
   ============================== */

document
.getElementById("signupForm")
.addEventListener("submit",async function(e){

  e.preventDefault();

  const fullName=
    document.getElementById("fullName")
    .value.trim();

  const email=
    document.getElementById("email")
    .value.trim()
    .toLowerCase();

  const phone=
    document.getElementById("phone")
    .value.trim();

  const role=
    document.getElementById("role")
    .value;

  const password=
    document.getElementById("password")
    .value;

  const confirmPassword=
    document.getElementById("confirmPassword")
    .value;

  const button=
    document.getElementById("signupButton");


  hideMessage();


  if(password!==confirmPassword){

    showMessage(
      "Passwords do not match.",
      "error"
    );

    return;
  }


  if(password.length<6){

    showMessage(
      "Password must be at least 6 characters.",
      "error"
    );

    return;
  }


  button.disabled=true;
  button.textContent="Creating account...";


  try{

    /* CREATE SUPABASE AUTH USER */

    const {
      data,
      error
    } =
    await supabaseClient.auth.signUp({

      email:email,
      password:password

    });


    if(error){

      showMessage(
        error.message,
        "error"
      );

      button.disabled=false;
      button.textContent="Create Account";

      return;
    }


    const user=data.user;


    if(!user){

      showMessage(
        "Account could not be created.",
        "error"
      );

      button.disabled=false;
      button.textContent="Create Account";

      return;
    }


    /*
      VERY IMPORTANT:
      auth_user_id is EXACTLY user.id
    */

    const {
      error:profileError
    } =
    await supabaseClient
    .from("user_profiles")
    .insert({

      auth_user_id:user.id,

      full_name:fullName,

      email:email,

      phone:phone,

      role:role,

      status:"pending"

    });


    if(profileError){

      console.error(profileError);

      showMessage(
        "Account was created but the profile could not be saved. Contact the administrator.",
        "error"
      );

      button.disabled=false;
      button.textContent="Create Account";

      return;
    }


    if(data.session){

      await supabaseClient
        .auth
        .signOut();

    }


    document
      .getElementById("signupForm")
      .reset();


    showMessage(
      "Account created successfully. Your account is now PENDING Administrator approval.",
      "pending"
    );


    button.disabled=false;
    button.textContent="Create Account";


  }catch(error){

    console.error(error);

    showMessage(
      "Something went wrong. Please try again.",
      "error"
    );

    button.disabled=false;
    button.textContent="Create Account";

  }

});


function showMessage(text,type){

  const box=
    document.getElementById("message");

  box.textContent=text;

  box.className=
    "message "+type;

  box.style.display="block";

}


function hideMessage(){

  document.getElementById("message")
    .style.display="none";

}

</script>

</body>
</html>
