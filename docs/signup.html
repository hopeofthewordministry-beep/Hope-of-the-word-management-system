<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Create Account | Hope of the Word Ministry</title>

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
  </script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .signup-box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 14px;
      box-shadow: 0 5px 25px rgba(0,0,0,0.10);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      color: #123b5d;
      font-size: 25px;
    }

    .header p {
      color: #6b7280;
      margin-top: 8px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #374151;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #123b5d;
    }

    .password-note {
      font-size: 12px;
      color: #6b7280;
      margin-top: 5px;
    }

    .signup-button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 7px;
      background: #123b5d;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    .signup-button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .message {
      margin-top: 18px;
      padding: 12px;
      border-radius: 7px;
      display: none;
      font-size: 14px;
      line-height: 1.5;
    }

    .success {
      display: block;
      background: #d1fae5;
      color: #065f46;
    }

    .error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
    }

    .login-link a {
      color: #123b5d;
      font-weight: bold;
      text-decoration: none;
    }

  </style>

</head>


<body>

  <div class="signup-box">

    <div class="header">

      <h1>
        Hope of the Word Ministry
      </h1>

      <p>
        Create your Ministry Management Account
      </p>

    </div>


    <form id="signupForm">


      <!-- FULL NAME -->

      <label for="fullName">
        Full Name
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
      >


      <!-- EMAIL -->

      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email address"
        required
      >


      <!-- PHONE -->

      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
      >


      <!-- ROLE -->

      <label for="role">
        User Role
      </label>

      <select
        id="role"
        required
      >

        <option value="">
          Select your role
        </option>

        <option value="pastor">
          Pastor
        </option>

        <option value="secretary">
          Secretary
        </option>

        <option value="treasurer">
          Treasurer
        </option>

      </select>


      <!-- PASSWORD -->

      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >

      <div class="password-note">
        Password must be at least 6 characters.
      </div>


      <!-- CONFIRM PASSWORD -->

      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Enter password again"
        minlength="6"
        required
      >


      <button
        type="submit"
        class="signup-button"
        id="signupButton"
      >
        Create Account
      </button>


      <div
        id="message"
        class="message"
      ></div>


    </form>


    <div class="login-link">

      Already have an account?

      <a href="index.html">
        Login
      </a>

    </div>

  </div>


<script>


/* =========================================
   SUPABASE CONNECTION
   ========================================= */

const SUPABASE_URL =
  "https://lcrhoossfgxpktrvwdtj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_KPNyDlm7lteOz0f1bivVAw_CbTAGbtH";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   SIGNUP
   ========================================= */

document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const role =
        document
          .getElementById("role")
          .value;


      const password =
        document
          .getElementById("password")
          .value;


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      const button =
        document
          .getElementById("signupButton");


      const message =
        document
          .getElementById("message");


      /* CLEAR MESSAGE */

      message.className =
        "message";

      message.textContent =
        "";


      /* VALIDATION */

      if (
        !fullName ||
        !email ||
        !role ||
        !password
      ) {

        message.className =
          "message error";

        message.textContent =
          "Please complete all required fields.";

        return;

      }


      if (
        password.length < 6
      ) {

        message.className =
          "message error";

        message.textContent =
          "Password must be at least 6 characters.";

        return;

      }


      if (
        password !==
        confirmPassword
      ) {

        message.className =
          "message error";

        message.textContent =
          "Passwords do not match.";

        return;

      }


      button.disabled =
        true;

      button.textContent =
        "Creating account...";


      try {


        /* =================================
           CREATE AUTH ACCOUNT
           ================================= */

        const {
          data: authData,
          error: authError
        } =
          await supabaseClient.auth.signUp({

            email:
              email,

            password:
              password

          });


        if (authError) {

          message.className =
            "message error";

          message.textContent =
            authError.message;

          button.disabled =
            false;

          button.textContent =
            "Create Account";

          return;

        }


        /* =================================
           GET AUTH USER ID
           ================================= */

        const user =
          authData.user;


        if (!user) {

          message.className =
            "message error";

          message.textContent =
            "Account could not be created. Please try again.";

          button.disabled =
            false;

          button.textContent =
            "Create Account";

          return;

        }


        const authUserId =
          user.id;


        /* =================================
           CREATE USER PROFILE
           ================================= */

        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from("user_profiles")
            .insert({

              auth_user_id:
                authUserId,

              full_name:
                fullName,

              email:
                email,

              phone:
                phone || null,

              role:
                role,

              status:
                "pending"

            })
            .select()
            .single();


        if (profileError) {

          console.error(
            "Profile error:",
            profileError
          );


          /*
           If profile creation fails,
           remove the authentication
           session so the user can try
           again after the problem is fixed.
          */

          await supabaseClient.auth.signOut();


          message.className =
            "message error";

          message.textContent =
            "Account was created, but the profile could not be saved: " +
            profileError.message;


          button.disabled =
            false;

          button.textContent =
            "Create Account";

          return;

        }


        /* =================================
           SUCCESS
           ================================= */

        message.className =
          "message success";

        message.textContent =
          "Account created successfully. Pending Administrator approval.";


        document
          .getElementById("signupForm")
          .reset();


        button.disabled =
          false;

        button.textContent =
          "Create Account";


        /*
         Sign out after successful
         profile creation because the
         account is still pending.
        */

        await supabaseClient.auth.signOut();

      }

      catch (error) {

        console.error(
          "Signup error:",
          error
        );


        message.className =
          "message error";

        message.textContent =
          "Something went wrong: " +
          error.message;


        button.disabled =
          false;

        button.textContent =
          "Create Account";

      }

    }
  );


</script>

</body>

</html>
