<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      padding: 20px;
    }

    .box {
      max-width: 450px;
      margin: 30px auto;
      background: white;
      padding: 25px;
      border-radius: 10px;
    }

    h2 {
      text-align: center;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }

    input, select {
      width: 100%;
      padding: 12px;
      margin-top: 6px;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 20px;
      background: #123b5d;
      color: white;
      border: none;
      cursor: pointer;
    }

    #message {
      margin-top: 15px;
      text-align: center;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="box">

  <h2>Create Account</h2>

  <form id="signupForm">

    <label>Full Name</label>
    <input
      type="text"
      id="full_name"
      required
    >

    <label>Email Address</label>
    <input
      type="email"
      id="email"
      required
    >

    <label>Phone Number</label>
    <input
      type="tel"
      id="phone"
      required
    >

    <label>Password</label>
    <input
      type="password"
      id="password"
      required
    >

    <label>Confirm Password</label>
    <input
      type="password"
      id="confirmPassword"
      required
    >

    <label>Select Role</label>

    <select id="role" required>

      <option value="">
        Select role
      </option>

      <option value="pastor">
        Pastor
      </option>

      <option value="secretary">
        Secretary
      </option>

      <option value="treasurer">
        Treasurer
      </option>

      <option value="administrator">
        Administrator
      </option>

    </select>

    <button type="submit">
      Create Account
    </button>

  </form>

  <div id="message"></div>

  <p style="text-align:center;">
    <a href="index.html">Back to Login</a>
  </p>

</div>


<script>

const SUPABASE_URL =
  "YOUR_EXISTING_SUPABASE_URL";

const SUPABASE_KEY =
  "sb_publishable_KPNyDlm7lteOz0f1bivVAw_CbTAGbtH";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const fullName =
        document
          .getElementById("full_name")
          .value
          .trim();

      const email =
        document
          .getElementById("email")
          .value
          .trim();

      const phone =
        document
          .getElementById("phone")
          .value
          .trim();

      const password =
        document
          .getElementById("password")
          .value;

      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;

      const role =
        document
          .getElementById("role")
          .value;


      if (
        password !==
        confirmPassword
      ) {

        document
          .getElementById("message")
          .textContent =
          "Passwords do not match.";

        return;
      }


      const message =
        document
          .getElementById("message");

      message.textContent =
        "Creating account...";


      const {
        data,
        error
      } =
        await supabaseClient.auth.signUp({

          email:
            email,

          password:
            password

        });


      if (error) {

        message.textContent =
          error.message;

        return;
      }


      if (!data.user) {

        message.textContent =
          "Account could not be created.";

        return;
      }


      const {
        error: profileError
      } =
        await supabaseClient
          .from("user_profiles")
          .insert({

            full_name:
              fullName,

            email:
              email,

            role:
              role,

            auth_user_id:
              data.user.id,

            phone:
              phone,

            status:
              "pending"

          });


      if (profileError) {

        message.textContent =
          "Account created, but profile could not be saved: " +
          profileError.message;

        return;
      }


      message.textContent =
        "Account created successfully. Pending Administrator approval.";

      document
        .getElementById("signupForm")
        .reset();

    }
  );

</script>

</body>
</html>
