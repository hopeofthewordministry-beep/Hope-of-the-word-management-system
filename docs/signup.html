<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Create Account | Hope of the Word Ministry</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #123b5d, #1d638f);
    }

    .signup-box {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.18);
    }

    .header {
      text-align: center;
      margin-bottom: 22px;
    }

    .header h1 {
      margin: 0;
      color: #123b5d;
      font-size: 25px;
    }

    .header p {
      color: #6b7280;
      margin: 8px 0 0;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: #374151;
    }

    input,
    select {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
      background: white;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: #123b5d;
    }

    .signup-button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 7px;
      background: #123b5d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .signup-button:disabled {
      opacity: 0.6;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 7px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.success {
      display: block;
      background: #d1fae5;
      color: #065f46;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .pending-box {
      display: none;
      margin-top: 18px;
      padding: 16px;
      border-radius: 9px;
      background: #fff7ed;
      border: 1px solid #fed7aa;
      color: #9a3412;
      text-align: center;
    }

    .pending-box strong {
      display: block;
      margin-bottom: 6px;
      font-size: 16px;
    }

    .login-link {
      text-align: center;
      margin-top: 20px;
      color: #6b7280;
    }

    .login-link a {
      color: #123b5d;
      font-weight: bold;
      text-decoration: none;
    }

    .status-note {
      margin-top: 10px;
      font-size: 13px;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>

<body>

  <div class="signup-box">

    <div class="header">
      <h1>Hope of the Word Ministry</h1>
      <p>Create New Account</p>
    </div>


    <form id="signupForm">

      <label for="fullName">
        Full Name
      </label>

      <input
        type="text"
        id="fullName"
        placeholder="Enter your full name"
        required
      >


      <label for="email">
        Email Address
      </label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email address"
        required
      >


      <label for="phone">
        Phone Number
      </label>

      <input
        type="tel"
        id="phone"
        placeholder="Enter your phone number"
      >


      <label for="role">
        User Role
      </label>

      <select
        id="role"
        required
      >

        <option value="">
          Select your role
        </option>

        <option value="pastor">
          Pastor
        </option>

        <option value="secretary">
          Secretary
        </option>

        <option value="treasurer">
          Treasurer
        </option>

      </select>


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Create a password"
        minlength="6"
        required
      >


      <label for="confirmPassword">
        Confirm Password
      </label>

      <input
        type="password"
        id="confirmPassword"
        placeholder="Confirm your password"
        minlength="6"
        required
      >


      <button
        type="submit"
        class="signup-button"
        id="signupButton"
      >
        Create Account
      </button>


      <div
        id="message"
        class="message"
      ></div>


      <!-- PENDING STATUS -->

      <div
        id="pendingBox"
        class="pending-box"
      >

        <strong>
          🟠 Pending Administrator Approval
        </strong>

        Your account has been created successfully.

        <br>

        Please wait for the Administrator
        to approve your account before signing in.

      </div>


      <div class="status-note">
        Your account remains pending until it is approved.
      </div>

    </form>


    <div class="login-link">

      Already have an account?

      <a href="index.html">
        Sign In
      </a>

    </div>

  </div>


<script>


/* =========================================
   SUPABASE CONNECTION
   ========================================= */

const SUPABASE_URL =
  "https://lcrhoossfgxpktrvwdtj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_KPNyDlm7lteOz0f1bivVAw_CbTAGbtH";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/* =========================================
   SIGNUP
   ========================================= */

document
  .getElementById("signupForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();


      const fullName =
        document
          .getElementById("fullName")
          .value
          .trim();


      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();


      const phone =
        document
          .getElementById("phone")
          .value
          .trim();


      const role =
        document
          .getElementById("role")
          .value;


      const password =
        document
          .getElementById("password")
          .value;


      const confirmPassword =
        document
          .getElementById("confirmPassword")
          .value;


      const button =
        document
          .getElementById("signupButton");


      const message =
        document
          .getElementById("message");


      const pendingBox =
        document
          .getElementById("pendingBox");


      message.className =
        "message";

      message.textContent = "";

      pendingBox.style.display =
        "none";


      if (
        !fullName ||
        !email ||
        !role ||
        !password
      ) {

        message.className =
          "message error";

        message.textContent =
          "Please complete all required fields.";

        return;
      }


      if (
        password.length < 6
      ) {

        message.className =
          "message error";

        message.textContent =
          "Password must be at least 6 characters.";

        return;
      }


      if (
        password !==
        confirmPassword
      ) {

        message.className =
          "message error";

        message.textContent =
          "Passwords do not match.";

        return;
      }


      button.disabled =
        true;

      button.textContent =
        "Creating Account...";


      try {


        /* CREATE AUTH USER */

        const {
          data: authData,
          error: authError
        } =
          await supabaseClient.auth.signUp({

            email:
              email,

            password:
              password

          });


        if (authError) {

          throw authError;

        }


        if (
          !authData ||
          !authData.user
        ) {

          throw new Error(
            "The account could not be created."
          );

        }


        const authUserId =
          authData.user.id;


        /* CREATE PROFILE */

        const {
          error: profileError
        } =
          await supabaseClient
            .from("user_profiles")
            .insert({

              auth_user_id:
                authUserId,

              full_name:
                fullName,

              email:
                email,

              phone:
                phone || null,

              role:
                role,

              status:
                "pending"

            });


        if (profileError) {

          console.error(
            "Profile error:",
            profileError
          );

          throw new Error(
            "Account was created, but the profile could not be saved: " +
            profileError.message
          );

        }


        /* SUCCESS */

        message.className =
          "message success";

        message.textContent =
          "Account created successfully.";


        pendingBox.style.display =
          "block";


        /*
          Sign the user out because
          Administrator approval is
          required before login.
        */

        await supabaseClient.auth.signOut();


        document
          .getElementById("signupForm")
          .reset();


        button.disabled =
          false;

        button.textContent =
          "Create Account";

      }


      catch (error) {

        console.error(
          "Signup error:",
          error
        );


        message.className =
          "message error";

        message.textContent =
          error.message;


        button.disabled =
          false;

        button.textContent =
          "Create Account";

      }

    }
  );

</script>

</body>
</html>
