<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Members - Hope of the Word Ministry</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      background: #f4f6f9;
      color: #222;
    }

    header {
      background: #123b5d;
      color: white;
      padding: 18px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header h1 {
      margin: 0;
      font-size: 20px;
    }

    button {
      cursor: pointer;
    }

    .back {
      border: none;
      padding: 9px 14px;
      border-radius: 6px;
    }

    .container {
      max-width: 1100px;
      margin: auto;
      padding: 20px;
    }

    .box {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 8px rgba(0,0,0,.08);
    }

    h2 {
      color: #123b5d;
      margin-top: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 6px;
      font-size: 14px;
    }

    input,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #ccc;
      border-radius: 6px;
    }

    .full {
      grid-column: 1 / -1;
    }

    .save {
      margin-top: 18px;
      background: #123b5d;
      color: white;
      border: none;
      padding: 12px 20px;
      border-radius: 6px;
    }

    .search {
      margin-bottom: 15px;
    }

    .table-wrap {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      padding: 10px;
      border-bottom: 1px solid #ddd;
      text-align: left;
      white-space: nowrap;
    }

    th {
      background: #f1f3f5;
    }

    .delete {
      background: #c62828;
      color: white;
      border: none;
      padding: 6px 10px;
      border-radius: 5px;
    }

    .message {
      display: none;
      padding: 12px;
      margin-bottom: 15px;
      border-radius: 6px;
    }

    .success {
      background: #d9f7df;
      color: #176b2c;
    }

    .error {
      background: #ffdede;
      color: #a00000;
    }
  </style>
</head>

<body>

<header>
  <h1>Hope of the Word Ministry</h1>

  <button class="back" onclick="goBack()">
    Dashboard
  </button>
</header>


<div class="container">

  <div id="message" class="message"></div>


  <!-- ADD MEMBER -->

  <div class="box">

    <h2>Add Church Member</h2>

    <div class="grid">

      <div>
        <label>Full Name</label>
        <input
          id="full_name"
          type="text"
          placeholder="Full name">
      </div>


      <div>
        <label>Phone Number</label>
        <input
          id="phone"
          type="text"
          placeholder="Phone number">
      </div>


      <div>
        <label>Gender</label>

        <select id="gender">
          <option value="">Select gender</option>
          <option value="Male">Male</option>
          <option value="Female">Female</option>
        </select>

      </div>


      <div>
        <label>Date of Birth</label>

        <input
          id="date_of_birth"
          type="date">

      </div>


      <div class="full">

        <label>Address</label>

        <input
          id="address"
          type="text"
          placeholder="Residential address">

      </div>


      <div>

        <label>Membership Status</label>

        <select id="membership_status">

          <option value="Active">
            Active
          </option>

          <option value="Inactive">
            Inactive
          </option>

          <option value="Visitor">
            Visitor
          </option>

        </select>

      </div>

    </div>


    <button
      class="save"
      id="saveButton"
      onclick="addMember()">

      Add Member

    </button>

  </div>


  <!-- MEMBER LIST -->

  <div class="box">

    <h2>Church Members</h2>

    <input
      id="search"
      class="search"
      type="text"
      placeholder="Search members..."
      oninput="filterMembers()">


    <div class="table-wrap">

      <table>

        <thead>

          <tr>
            <th>Name</th>
            <th>Phone</th>
            <th>Gender</th>
            <th>Date of Birth</th>
            <th>Address</th>
            <th>Status</th>
            <th>Action</th>
          </tr>

        </thead>

        <tbody id="membersList">

        </tbody>

      </table>

    </div>

  </div>

</div>


<script>

/* ==============================
   SUPABASE
============================== */

const SUPABASE_URL =
  "https://lcrhoossfgxpktrvwdtj.supabase.co";


/*
  PASTE YOUR SUPABASE PUBLISHABLE KEY
  BETWEEN THE QUOTATION MARKS BELOW.
*/

const SUPABASE_KEY =
  "sb_publishable_KPNyDlm7lteOz0f1bivVAw_CbTAGbtH";


const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


/*
  YOUR ACTUAL SUPABASE TABLE
*/

const TABLE_NAME =
  "church_members";


let allMembers = [];


/* ==============================
   LOAD MEMBERS
============================== */

async function loadMembers() {

  const list =
    document.getElementById(
      "membersList"
    );


  list.innerHTML = `
    <tr>
      <td colspan="7">
        Loading members...
      </td>
    </tr>
  `;


  const { data, error } =
    await supabaseClient
      .from(TABLE_NAME)
      .select("*")
      .order(
        "created_at",
        {
          ascending: false
        }
      );


  if (error) {

    console.error(error);

    showMessage(
      "Could not load members: " +
      error.message,
      "error"
    );

    return;
  }


  allMembers = data || [];

  displayMembers(allMembers);
}


/* ==============================
   DISPLAY MEMBERS
============================== */

function displayMembers(members) {

  const list =
    document.getElementById(
      "membersList"
    );


  list.innerHTML = "";


  if (members.length === 0) {

    list.innerHTML = `
      <tr>
        <td colspan="7">
          No members found.
        </td>
      </tr>
    `;

    return;
  }


  members.forEach(function(member) {

    const row =
      document.createElement("tr");


    const phoneNumber =
      member["phone number"] || "";


    row.innerHTML = `

      <td>
        ${escapeHTML(
          member.full_name || ""
        )}
      </td>

      <td>
        ${escapeHTML(
          phoneNumber
        )}
      </td>

      <td>
        ${escapeHTML(
          member.gender || ""
        )}
      </td>

      <td>
        ${escapeHTML(
          member.date_of_birth || ""
        )}
      </td>

      <td>
        ${escapeHTML(
          member.address || ""
        )}
      </td>

      <td>
        ${escapeHTML(
          member.membership_status || ""
        )}
      </td>

      <td>

        <button
          class="delete"
          onclick="deleteMember('${member.id}')">

          Delete

        </button>

      </td>

    `;


    list.appendChild(row);

  });

}


/* ==============================
   ADD MEMBER
============================== */

async function addMember() {

  const fullName =
    document.getElementById(
      "full_name"
    ).value.trim();


  const phone =
    document.getElementById(
      "phone"
    ).value.trim();


  const gender =
    document.getElementById(
      "gender"
    ).value;


  const dateOfBirth =
    document.getElementById(
      "date_of_birth"
    ).value;


  const address =
    document.getElementById(
      "address"
    ).value.trim();


  const status =
    document.getElementById(
      "membership_status"
    ).value;


  if (!fullName) {

    showMessage(
      "Please enter the member's full name.",
      "error"
    );

    return;
  }


  const button =
    document.getElementById(
      "saveButton"
    );


  button.disabled = true;

  button.textContent =
    "Saving...";


  /*
    IMPORTANT:
    Your database column is exactly:

    phone number

    Because it contains a space,
    we use ["phone number"].
  */

  const memberData = {

    full_name:
      fullName,

    "phone number":
      phone,

    gender:
      gender,

    date_of_birth:
      dateOfBirth || null,

    address:
      address,

    membership_status:
      status

  };


  const { error } =
    await supabaseClient
      .from(TABLE_NAME)
      .insert(memberData);


  button.disabled = false;

  button.textContent =
    "Add Member";


  if (error) {

    console.error(error);

    showMessage(
      "Could not add member: " +
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Member added successfully.",
    "success"
  );


  document.getElementById(
    "full_name"
  ).value = "";


  document.getElementById(
    "phone"
  ).value = "";


  document.getElementById(
    "gender"
  ).value = "";


  document.getElementById(
    "date_of_birth"
  ).value = "";


  document.getElementById(
    "address"
  ).value = "";


  document.getElementById(
    "membership_status"
  ).value = "Active";


  loadMembers();

}


/* ==============================
   DELETE MEMBER
============================== */

async function deleteMember(id) {

  if (
    !confirm(
      "Are you sure you want to delete this member?"
    )
  ) {

    return;
  }


  const { error } =
    await supabaseClient
      .from(TABLE_NAME)
      .delete()
      .eq(
        "id",
        id
      );


  if (error) {

    showMessage(
      "Could not delete member: " +
      error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Member deleted successfully.",
    "success"
  );


  loadMembers();

}


/* ==============================
   SEARCH
============================== */

function filterMembers() {

  const search =
    document.getElementById(
      "search"
    ).value
      .toLowerCase()
      .trim();


  const filtered =
    allMembers.filter(
      function(member) {

        const name =
          (
            member.full_name || ""
          ).toLowerCase();


        const phone =
          (
            member["phone number"] || ""
          ).toLowerCase();


        return (
          name.includes(search) ||
          phone.includes(search)
        );

      }
    );


  displayMembers(filtered);

}


/* ==============================
   MESSAGE
============================== */

function showMessage(
  text,
  type
) {

  const message =
    document.getElementById(
      "message"
    );


  message.textContent =
    text;


  message.className =
    "message " + type;


  message.style.display =
    "block";


  setTimeout(
    function() {

      message.style.display =
        "none";

    },
    5000
  );

}


/* ==============================
   SECURITY
============================== */

function escapeHTML(value) {

  return String(value)

    .replace(
      /&/g,
      "&amp;"
    )

    .replace(
      /</g,
      "&lt;"
    )

    .replace(
      />/g,
      "&gt;"
    )

    .replace(
      /"/g,
      "&quot;"
    )

    .replace(
      /'/g,
      "&#039;"
    );

}


/* ==============================
   DASHBOARD
============================== */

function goBack() {

  window.location.href =
    "dashboard.html";

}


/* ==============================
   START
============================== */

loadMembers();

</script>

</body>
</html>
