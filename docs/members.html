<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Members - Hope of the Word Ministry</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f6f9;
  color:#1f2937;
}

header{
  background:#123b5d;
  color:white;
  padding:18px 20px;
  display:flex;
  justify-content:space-between;
  align-items:center;
}

header h1{
  font-size:20px;
}

.back{
  background:white;
  color:#123b5d;
  border:none;
  padding:9px 13px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.container{
  max-width:1100px;
  margin:auto;
  padding:20px;
}

.form-box,
.list-box{
  background:white;
  padding:20px;
  border-radius:12px;
  margin-bottom:20px;
  box-shadow:0 2px 8px rgba(0,0,0,.07);
}

h2{
  color:#123b5d;
  margin-bottom:18px;
  font-size:20px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(
    auto-fit,
    minmax(200px,1fr)
  );
  gap:15px;
}

label{
  display:block;
  font-size:13px;
  font-weight:bold;
  margin-bottom:6px;
}

input,
select{
  width:100%;
  padding:12px;
  border:1px solid #d1d5db;
  border-radius:7px;
  font-size:14px;
}

.full{
  grid-column:1/-1;
}

.save{
  margin-top:18px;
  background:#123b5d;
  color:white;
  border:none;
  padding:13px 20px;
  border-radius:7px;
  font-weight:bold;
  cursor:pointer;
}

.search{
  width:100%;
  margin-bottom:15px;
}

table{
  width:100%;
  border-collapse:collapse;
}

th,
td{
  padding:11px;
  border-bottom:1px solid #eee;
  text-align:left;
  font-size:13px;
}

th{
  background:#f3f4f6;
  color:#123b5d;
}

.delete{
  background:#b91c1c;
  color:white;
  border:none;
  padding:6px 9px;
  border-radius:5px;
  cursor:pointer;
}

.message{
  display:none;
  margin-bottom:15px;
  padding:11px;
  border-radius:7px;
  font-size:14px;
}

.success{
  background:#dcfce7;
  color:#166534;
}

.error{
  background:#fee2e2;
  color:#991b1b;
}

@media(max-width:650px){
  table{
    display:block;
    overflow-x:auto;
  }
}
</style>
</head>

<body>

<header>

<h1>
Hope of the Word Ministry
</h1>

<button
class="back"
onclick="goBack()">
Dashboard
</button>

</header>


<div class="container">

<div
id="message"
class="message">
</div>


<!-- ADD MEMBER -->

<div class="form-box">

<h2>
Add Church Member
</h2>

<div class="grid">

<div>
<label>Full Name</label>

<input
id="full_name"
type="text"
placeholder="Full name">
</div>


<div>
<label>Phone Number</label>

<input
id="phone"
type="text"
placeholder="Phone number">
</div>


<div>
<label>Gender</label>

<select id="gender">

<option value="">
Select gender
</option>

<option value="Male">
Male
</option>

<option value="Female">
Female
</option>

</select>
</div>


<div>
<label>Date of Birth</label>

<input
id="date_of_birth"
type="date">
</div>


<div class="full">
<label>Address</label>

<input
id="address"
type="text"
placeholder="Residential address">
</div>


<div>
<label>Membership Status</label>

<select id="membership_status">

<option value="Active">
Active
</option>

<option value="Inactive">
Inactive
</option>

<option value="Visitor">
Visitor
</option>

</select>
</div>

</div>


<button
class="save"
onclick="addMember()">

Add Member

</button>

</div>


<!-- MEMBER LIST -->

<div class="list-box">

<h2>
Church Members
</h2>

<input
class="search"
id="search"
type="text"
placeholder="Search members..."
oninput="filterMembers()">


<div style="overflow-x:auto">

<table>

<thead>

<tr>
<th>Name</th>
<th>Phone</th>
<th>Gender</th>
<th>Date of Birth</th>
<th>Status</th>
<th>Action</th>
</tr>

</thead>

<tbody id="membersList">
</tbody>

</table>

</div>

</div>

</div>


<script>

/* =========================
   CHECK USER ROLE
========================= */

const role =
localStorage.getItem("churchRole");

const allowedRoles = [
  "pastor",
  "secretary",
  "admin"
];

if(!allowedRoles.includes(role)){

  alert(
    "You do not have permission to access Members."
  );

  window.location.href =
    "dashboard.html";
}


/* =========================
   SUPABASE CONNECTION
========================= */

const SUPABASE_URL =
"https://lcrhoossfgxpktrvwdtj.supabase.co";


/*
  IMPORTANT:
  Replace the text below with
  YOUR SUPABASE PUBLISHABLE KEY.

  Do NOT use the Secret key.
*/

const SUPABASE_KEY =
"sb_publishable_KPNyDlm7lteOz0f1bivVAw_CbTAGbtH";


const supabaseClient =
supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* =========================
   MEMBERS
========================= */

let allMembers = [];


/* LOAD MEMBERS */

async function loadMembers(){

  const { data, error } =
    await supabaseClient
      .from("church_members")
      .select("*")
      .order(
        "created_at",
        { ascending:false }
      );

  if(error){

    showMessage(
      "Could not load members: "
      + error.message,
      "error"
    );

    return;
  }

  allMembers = data || [];

  displayMembers(allMembers);
}


/* DISPLAY MEMBERS */

function displayMembers(members){

  const list =
    document.getElementById(
      "membersList"
    );

  list.innerHTML = "";


  members.forEach(function(member){

    const row =
      document.createElement("tr");

    row.innerHTML = `

      <td>
        ${escapeHTML(member.full_name || "")}
      </td>

      <td>
        ${escapeHTML(member.phone || "")}
      </td>

      <td>
        ${escapeHTML(member.gender || "")}
      </td>

      <td>
        ${escapeHTML(member.date_of_birth || "")}
      </td>

      <td>
        ${escapeHTML(member.membership_status || "")}
      </td>

      <td>

        <button
          class="delete"
          onclick="deleteMember('${member.id}')">

          Delete

        </button>

      </td>

    `;

    list.appendChild(row);
  });
}


/* =========================
   ADD MEMBER
========================= */

async function addMember(){

  const full_name =
    document.getElementById(
      "full_name"
    ).value.trim();

  const phone =
    document.getElementById(
      "phone"
    ).value.trim();

  const gender =
    document.getElementById(
      "gender"
    ).value;

  const date_of_birth =
    document.getElementById(
      "date_of_birth"
    ).value;

  const address =
    document.getElementById(
      "address"
    ).value.trim();

  const membership_status =
    document.getElementById(
      "membership_status"
    ).value;


  if(!full_name){

    showMessage(
      "Please enter the member's name.",
      "error"
    );

    return;
  }


  const { error } =
    await supabaseClient
      .from("members")
      .insert({

        full_name:full_name,

        phone:phone,

        gender:gender,

        date_of_birth:
          date_of_birth || null,

        address:address,

        membership_status:
          membership_status

      });


  if(error){

    showMessage(
      "Could not add member: "
      + error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Member added successfully.",
    "success"
  );


  document.getElementById(
    "full_name"
  ).value = "";

  document.getElementById(
    "phone"
  ).value = "";

  document.getElementById(
    "gender"
  ).value = "";

  document.getElementById(
    "date_of_birth"
  ).value = "";

  document.getElementById(
    "address"
  ).value = "";


  loadMembers();
}


/* =========================
   DELETE MEMBER
========================= */

async function deleteMember(id){

  const confirmed =
    confirm(
      "Are you sure you want to delete this member?"
    );

  if(!confirmed){
    return;
  }


  const { error } =
    await supabaseClient
      .from("members")
      .delete()
      .eq("id",id);


  if(error){

    showMessage(
      "Could not delete member: "
      + error.message,
      "error"
    );

    return;
  }


  showMessage(
    "Member deleted.",
    "success"
  );


  loadMembers();
}


/* =========================
   SEARCH
========================= */

function filterMembers(){

  const search =
    document.getElementById(
      "search"
    ).value.toLowerCase();


  const filtered =
    allMembers.filter(
      function(member){

        return (

          (member.full_name || "")
            .toLowerCase()
            .includes(search)

          ||

          (member.phone || "")
            .toLowerCase()
            .includes(search)

        );

      }
    );


  displayMembers(filtered);
}


/* =========================
   MESSAGE
========================= */

function showMessage(
  text,
  type
){

  const message =
    document.getElementById(
      "message"
    );

  message.textContent =
    text;

  message.className =
    "message " + type;

  message.style.display =
    "block";
}


/* =========================
   SECURITY
========================= */

function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");
}


/* =========================
   BACK TO DASHBOARD
========================= */

function goBack(){

  window.location.href =
    "dashboard.html";
}


/* LOAD */

loadMembers();

</script>

</body>
  </html>
