<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Admin Login | Hope of the Word Ministry</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  font-family: Arial, sans-serif;
}

body {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  background: linear-gradient(135deg, #123b5d, #1d607d);
  padding: 20px;
}

.login-box {
  width: 100%;
  max-width: 420px;
  background: white;
  padding: 35px;
  border-radius: 16px;
  box-shadow: 0 15px 40px rgba(0,0,0,.2);
}

.logo {
  width: 70px;
  height: 70px;
  margin: 0 auto 18px;
  background: #123b5d;
  color: white;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 30px;
}

h1 {
  text-align: center;
  color: #123b5d;
  font-size: 22px;
}

.subtitle {
  text-align: center;
  color: #6b7280;
  margin: 8px 0 25px;
  font-size: 13px;
}

label {
  display: block;
  margin-bottom: 7px;
  font-weight: bold;
  font-size: 13px;
}

input {
  width: 100%;
  padding: 13px;
  margin-bottom: 18px;
  border: 1px solid #d1d5db;
  border-radius: 8px;
  font-size: 15px;
}

button {
  width: 100%;
  padding: 13px;
  background: #123b5d;
  color: white;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: bold;
}

#error {
  display: none;
  background: #fee2e2;
  color: #b91c1c;
  padding: 10px;
  border-radius: 7px;
  text-align: center;
  margin-bottom: 15px;
  font-size: 13px;
}
</style>
</head>

<body>

<div class="login-box">

<div class="logo">⛪</div>

<h1>Hope of the Word Ministry</h1>

<p class="subtitle">
Church Management System
</p>

<div id="error">
Incorrect username or password.
</div>

<form onsubmit="login(event)">

<label>Username</label>

<input
type="text"
id="username"
placeholder="Enter username"
required
>

<label>Password</label>

<input
type="password"
id="password"
placeholder="Enter password"
required
>

<button type="submit">
Login
</button>

</form>

</div>

<script>

function login(event) {

event.preventDefault();

const username =
document.getElementById("username").value.trim();

const password =
document.getElementById("password").value;

if (username === "admin" && password === "admin123") {

window.location.href = "dashboard.html";

} else {

document.getElementById("error").style.display = "block";

}

}

</script>

</body>
</html>
