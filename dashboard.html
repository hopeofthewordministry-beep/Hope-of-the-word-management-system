<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Church Management Dashboard</title>

<style>

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:Arial,sans-serif;
}

body{
background:#f4f6f9;
color:#1f2937;
}

header{
background:#123b5d;
color:white;
padding:18px 20px;
display:flex;
justify-content:space-between;
align-items:center;
}

.church-name{
font-size:20px;
font-weight:bold;
}

.branch{
font-size:12px;
margin-top:5px;
opacity:.8;
}

.logout{
background:white;
color:#123b5d;
border:none;
padding:10px 15px;
border-radius:7px;
font-weight:bold;
cursor:pointer;
}

.container{
max-width:1200px;
margin:auto;
padding:25px;
}

.welcome{
margin-bottom:25px;
}

.welcome h2{
font-size:26px;
color:#123b5d;
margin-bottom:7px;
}

.welcome p{
color:#6b7280;
}

.role{
display:inline-block;
margin-top:10px;
padding:6px 12px;
background:#e6f0f6;
color:#123b5d;
border-radius:20px;
font-size:12px;
font-weight:bold;
}

.cards{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(200px,1fr));
gap:16px;
}

.card{
background:white;
padding:22px;
border-radius:12px;
box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.card-title{
font-size:14px;
color:#6b7280;
}

.card-number{
font-size:27px;
font-weight:bold;
color:#123b5d;
margin-top:10px;
}

.section{
background:white;
padding:22px;
border-radius:12px;
margin-top:25px;
box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.section h3{
color:#123b5d;
margin-bottom:16px;
}

.menu{
display:grid;
grid-template-columns:
repeat(auto-fit,minmax(180px,1fr));
gap:12px;
}

.menu button{
border:none;
background:#123b5d;
color:white;
padding:16px;
border-radius:8px;
font-size:14px;
cursor:pointer;
}

.menu button:hover{
background:#0d2d46;
}

.notice{
background:#eef6fa;
padding:15px;
border-radius:8px;
color:#36566a;
font-size:14px;
}

footer{
text-align:center;
padding:30px;
color:#777;
font-size:12px;
}

@media(max-width:600px){

header{
padding:15px;
}

.church-name{
font-size:16px;
}

.logout{
padding:8px 10px;
font-size:12px;
}

.container{
padding:16px;
}

.welcome h2{
font-size:22px;
}

}

</style>

</head>


<body>


<header>

<div>

<div class="church-name">
Hope of the Word Ministry
</div>

<div class="branch">
Buoho Framoase Branch
</div>

</div>


<button
class="logout"
onclick="logout()">

Logout

</button>

</header>


<div class="container">


<div class="welcome">

<h2 id="welcomeText">
Welcome
</h2>

<p>
Church Management System
</p>

<div
id="roleText"
class="role">

Loading...

</div>

</div>


<div class="cards">


<div class="card">

<div class="card-title">
Total Members
</div>

<div class="card-number">
0
</div>

</div>


<div class="card">

<div class="card-title">
Today's Attendance
</div>

<div class="card-number">
0
</div>

</div>


<div class="card">

<div class="card-title">
Tithes
</div>

<div class="card-number">
GH₵0.00
</div>

</div>


<div class="card">

<div class="card-title">
Offerings
</div>

<div class="card-number">
GH₵0.00
</div>

</div>

</div>


<div class="section">

<h3>
Available Activities
</h3>

<div
id="menu"
class="menu">
</div>

</div>


<div class="section">

<h3>
Church Information
</h3>

<div class="notice">

Your available activities depend on your
church role.

</div>

</div>


</div>


<footer>

© 2026 Hope of the Word Ministry

</footer>


<script>

/* GET LOGIN */

const role =
localStorage.getItem("churchRole");

const username =
localStorage.getItem("churchUser");


/* PROTECT DASHBOARD */

if(!role || !username){

window.location.href =
"index.html";

}


/* ROLE NAMES */

const roleNames = {

pastor:"Pastor",

secretary:"Secretary",

treasurer:"Treasurer",

admin:"Administrator"

};


const displayRole =
roleNames[role] || role;


document.getElementById(
"welcomeText"
).textContent =
"Welcome, " + displayRole;


document.getElementById(
"roleText"
).textContent =
"Logged in as: " + displayRole;


/* ROLE-BASED ACTIVITIES */

const activities = {


pastor:[

"👥 Members",

"⛪ Attendance",

"📅 Church Activities",

"👨‍👩‍👧 Departments",

"💰 Tithes & Offerings",

"📢 Announcements",

"📊 Reports",

"⚙️ My Account"

],


secretary:[

"👥 Members",

"⛪ Attendance",

"📅 Church Activities",

"👨‍👩‍👧 Departments",

"📢 Announcements",

"📊 Reports",

"⚙️ My Account"

],


treasurer:[

"💰 Tithes & Offerings",

"📊 Financial Reports",

"⚙️ My Account"

],


admin:[

"👥 Members",

"⛪ Attendance",

"📅 Church Activities",

"👨‍👩‍👧 Departments",

"💰 Tithes & Offerings",

"📢 Announcements",

"📊 Reports",

"👤 User Management",

"⚙️ System Settings"

]

};


/* DISPLAY ACTIVITIES */

const menu =
document.getElementById("menu");

const allowedActivities =
activities[role] || [];


allowedActivities.forEach(function(activity){

const button =
document.createElement("button");

button.textContent =
activity;

button.onclick = function(){

alert(
activity +
" will be developed next."
);

};

menu.appendChild(button);

});


/* LOGOUT */

function logout(){

localStorage.removeItem(
"churchRole"
);

localStorage.removeItem(
"churchUser"
);

window.location.href =
"index.html";

}

</script>


</body>
</html>
