<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hope of the Word Ministry</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      color: #222;
    }

    header {
      background: #173b57;
      color: white;
      padding: 20px;
      text-align: center;
    }

    header h1 {
      margin: 0;
      font-size: 24px;
    }

    header p {
      margin: 6px 0 0;
    }

    .container {
      max-width: 1000px;
      margin: 20px auto;
      padding: 15px;
    }

    .welcome {
      background: white;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 15px;
    }

    .card {
      background: white;
      padding: 20px;
      border-radius: 10px;
      text-align: center;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }

    .card h2 {
      color: #173b57;
      margin: 0;
    }

    .menu {
      margin-top: 20px;
      background: white;
      padding: 20px;
      border-radius: 10px;
    }

    .menu button {
      width: 100%;
      padding: 14px;
      margin: 6px 0;
      border: none;
      border-radius: 7px;
      background: #173b57;
      color: white;
      font-size: 16px;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>

<body>

  <header>
    <h1>Hope of the Word Ministry</h1>
    <p>Church Management System</p>
  </header>

  <div class="container">

    <div class="welcome">
      <h2>Welcome</h2>
      <p>
        Manage church members, attendance, activities,
        departments and finances from one place.
      </p>
    </div>

    <div class="cards">

      <div class="card">
        <h3>Total Members</h3>
        <h2>0</h2>
      </div>

      <div class="card">
        <h3>Attendance</h3>
        <h2>0</h2>
      </div>

      <div class="card">
        <h3>Departments</h3>
        <h2>0</h2>
      </div>

      <div class="card">
        <h3>Upcoming Events</h3>
        <h2>0</h2>
      </div>

    </div>

    <div class="menu">

      <h2>Church Management</h2>

      <button>Members</button>
      <button>Attendance</button>
      <button>Tithes & Offerings</button>
      <button>Church Activities</button>
      <button>Departments</button>
      <button>Announcements</button>
      <button>Reports</button>

    </div>

  </div>

  <footer>
    © 2026 Hope of the Word Ministry
  </footer>

</body>
</html>
