<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hope of the Word Ministry - Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      min-height: 100vh;
      background: linear-gradient(135deg, #123b5d, #1d607d);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .login-box {
      width: 100%;
      max-width: 430px;
      background: white;
      padding: 35px;
      border-radius: 18px;
      box-shadow: 0 15px 40px rgba(0,0,0,0.25);
    }

    .church-icon {
      width: 75px;
      height: 75px;
      background: #123b5d;
      color: white;
      border-radius: 50%;
      margin: 0 auto 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    h1 {
      text-align: center;
      color: #123b5d;
      font-size: 22px;
    }

    .subtitle {
      text-align: center;
      color: #777;
      font-size: 13px;
      margin: 8px 0 25px;
    }

    label {
      display: block;
      font-size: 14px;
      font-weight: bold;
      margin-bottom: 7px;
      color: #374151;
    }

    select,
    input {
      width: 100%;
      padding: 13px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      margin-bottom: 18px;
      font-size: 15px;
      background: white;
    }

    select:focus,
    input:focus {
      outline: none;
      border-color: #123b5d;
    }

    .login-button {
      width: 100%;
      padding: 14px;
      background: #123b5d;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:hover {
      background: #0d2d46;
    }

    .error {
      display: none;
      background: #fee2e2;
      color: #b91c1c;
      padding: 11px;
      border-radius: 8px;
      text-align: center;
      font-size: 13px;
      margin-bottom: 18px;
    }

    .test-info {
      background: #f3f6f8;
      margin-top: 20px;
      padding: 13px;
      border-radius: 8px;
      font-size: 12px;
      color: #555;
      line-height: 1.6;
    }

    .footer {
      text-align: center;
      color: #888;
      font-size: 12px;
      margin-top: 22px;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="church-icon">
      ⛪
    </div>

    <h1>Hope of the Word Ministry</h1>

    <p class="subtitle">
      Church Management System
    </p>

    <div id="errorMessage" class="error">
      Incorrect role, username or password.
    </div>

    <form onsubmit="login(event)">

      <label for="role">
        Login as
      </label>

      <select id="role" required>

        <option value="">
          Select your role
        </option>

        <option value="pastor">
          Pastor
        </option>

        <option value="secretary">
          Secretary
        </option>

        <option value="treasurer">
          Treasurer
        </option>

        <option value="admin">
          Administrator
        </option>

      </select>


      <label for="username">
        Username
      </label>

      <input
        type="text"
        id="username"
        placeholder="Enter username"
        autocomplete="username"
        required
      >


      <label for="password">
        Password
      </label>

      <input
        type="password"
        id="password"
        placeholder="Enter password"
        autocomplete="current-password"
        required
      >


      <button
        type="submit"
        class="login-button">
        Login
      </button>

    </form>


    <!-- TEMPORARY TEST INFORMATION -->

    <div class="test-info">

      <strong>Test Accounts</strong><br>

      Pastor:
      pastor / pastor123<br>

      Secretary:
      secretary / secretary123<br>

      Treasurer:
      treasurer / treasurer123<br>

      Administrator:
      admin / admin123

    </div>


    <div class="footer">
      © 2026 Hope of the Word Ministry
    </div>

  </div>


<script>

function login(event) {

  event.preventDefault();

  const role =
    document.getElementById("role").value;

  const username =
    document.getElementById("username").value.trim();

  const password =
    document.getElementById("password").value;


  /*
    TEMPORARY DEMO ACCOUNTS

    These will later be replaced
    with secure authentication.
  */

  const accounts = {

    pastor: {
      username: "pastor",
      password: "pastor123"
    },

    secretary: {
      username: "secretary",
      password: "secretary123"
    },

    treasurer: {
      username: "treasurer",
      password: "treasurer123"
    },

    admin: {
      username: "admin",
      password: "admin123"
    }

  };


  if (
    accounts[role] &&
    accounts[role].username === username &&
    accounts[role].password === password
  ) {

    localStorage.setItem(
      "churchRole",
      role
    );

    localStorage.setItem(
      "churchUser",
      username
    );

    window.location.href =
      "dashboard.html";

  } else {

    document.getElementById(
      "errorMessage"
    ).style.display = "block";

  }

}

</script>

</body>
</html>
