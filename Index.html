<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Sign In | Hope of the Word Ministry</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #123b5d, #1d638f);
    }

    .login-box {
      width: 100%;
      max-width: 420px;
      background: white;
      padding: 32px;
      border-radius: 16px;
      box-shadow: 0 10px 35px rgba(0,0,0,0.18);
    }

    .header {
      text-align: center;
      margin-bottom: 25px;
    }

    .header h1 {
      margin: 0;
      color: #123b5d;
      font-size: 25px;
    }

    .header p {
      margin: 8px 0 0;
      color: #6b7280;
    }

    label {
      display: block;
      margin-top: 16px;
      font-weight: bold;
      color: #374151;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-top: 7px;
      border: 1px solid #d1d5db;
      border-radius: 7px;
      font-size: 16px;
    }

    input:focus {
      outline: none;
      border-color: #123b5d;
    }

    .login-button {
      width: 100%;
      padding: 14px;
      margin-top: 24px;
      border: none;
      border-radius: 7px;
      background: #123b5d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .login-button:disabled {
      opacity: 0.6;
    }

    .message {
      display: none;
      margin-top: 15px;
      padding: 12px;
      border-radius: 7px;
      font-size: 14px;
      line-height: 1.5;
    }

    .message.error {
      display: block;
      background: #fee2e2;
      color: #991b1b;
    }

    .message.success {
      display: block;
      background: #d1fae5;
      color: #065f46;
    }

    .create-account {
      text-align: center;
      margin-top: 22px;
      color: #6b7280;
    }

    .create-account a {
      color: #123b5d;
      font-weight: bold;
      text-decoration: none;
    }

    .create-account a:hover {
      text-decoration: underline;
    }
  </style>
</head>

<body>

  <div class="login-box">

    <div class="header">
      <h1>Hope of the Word Ministry</h1>
      <p>Management System</p>
    </div>

    <form id="loginForm">

      <label for="email">Email Address</label>

      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="password">Password</label>

      <input
        type="password"
        id="password"
        placeholder="Enter your password"
        required
      >

      <button
        type="submit"
        class="login-button"
        id="loginButton"
      >
        Sign In
      </button>

      <div
        id="message"
        class="message"
      ></div>

    </form>

    <div class="create-account">
      Don't have an account?
      <a href="signup.html">Create New Account</a>
    </div>

  </div>


<script>

const SUPABASE_URL =
  "https://lcrhoossfgxpktrvwdtj.supabase.co";

const SUPABASE_KEY =
  "sb_publishable_KPNyDlm7lteOz0f1bivVAw_CbTAGbtH";

const supabaseClient =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
  );


document
  .getElementById("loginForm")
  .addEventListener(
    "submit",
    async function(event) {

      event.preventDefault();

      const email =
        document
          .getElementById("email")
          .value
          .trim()
          .toLowerCase();

      const password =
        document
          .getElementById("password")
          .value;

      const button =
        document
          .getElementById("loginButton");

      const message =
        document
          .getElementById("message");


      message.className = "message";
      message.textContent = "";

      button.disabled = true;
      button.textContent = "Signing In...";


      try {

        const {
          data: authData,
          error: authError
        } =
          await supabaseClient.auth
            .signInWithPassword({
              email: email,
              password: password
            });


        if (authError) {

          message.className =
            "message error";

          message.textContent =
            authError.message;

          button.disabled = false;
          button.textContent = "Sign In";

          return;
        }


        if (!authData.user) {

          throw new Error(
            "Unable to identify your account."
          );

        }


        const {
          data: profile,
          error: profileError
        } =
          await supabaseClient
            .from("user_profiles")
            .select(
              "id, full_name, email, phone, role, status, auth_user_id"
            )
            .eq(
              "auth_user_id",
              authData.user.id
            )
            .single();


        if (profileError || !profile) {

          await supabaseClient.auth.signOut();

          message.className =
            "message error";

          message.textContent =
            "Your profile could not be found.";

          button.disabled = false;
          button.textContent = "Sign In";

          return;
        }


        if (profile.status !== "approved") {

          await supabaseClient.auth.signOut();

          message.className =
            "message error";

          message.textContent =
            "Your account is still pending Administrator approval.";

          button.disabled = false;
          button.textContent = "Sign In";

          return;
        }


        localStorage.setItem(
          "user_profile",
          JSON.stringify(profile)
        );


        if (
          profile.role ===
          "administrator"
        ) {

          window.location.href =
            "dashboard.html";

        } else if (
          profile.role === "pastor"
        ) {

          window.location.href =
            "pastor.html";

        } else if (
          profile.role === "secretary"
        ) {

          window.location.href =
            "secretary.html";

        } else if (
          profile.role === "treasurer"
        ) {

          window.location.href =
            "treasurer.html";

        } else {

          window.location.href =
            "dashboard.html";

        }

      }

      catch (error) {

        console.error(error);

        message.className =
          "message error";

        message.textContent =
          error.message;

        button.disabled = false;
        button.textContent = "Sign In";
      }

    }
  );

</script>

</body>
</html>
